<style>
  :root {
    color-scheme: light;

    --red: #dc2626;
    --red-main: #c8102e;
    --red-dark: #991b1b;
    --red-deep: #7f1d1d;
    --red-soft: #fff1f2;
    --red-soft-2: #fef2f2;

    --ink: #18181b;
    --ink-soft: #3f3f46;
    --muted: #71717a;

    --line: #e4e4e7;
    --line-red: #fecaca;

    --page: #f4f4f5;
    --panel: #ffffff;
    --soft: #fafafa;
    --white: #ffffff;

    --green: #06c755;

    --shadow-sm: 0 2px 8px rgba(24, 24, 27, .05);
    --shadow: 0 8px 24px rgba(24, 24, 27, .08);
    --shadow-lg: 0 18px 50px rgba(24, 24, 27, .16);

    --radius-sm: 10px;
    --radius: 16px;
    --radius-lg: 22px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    min-height: 100%;
    background: var(--page);
  }

  body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(
        circle at top,
        rgba(220, 38, 38, .055),
        transparent 330px
      ),
      var(--page);

    color: var(--ink);

    font-family:
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      "Noto Sans Thai",
      sans-serif;

    -webkit-font-smoothing: antialiased;
  }

  button,
  input,
  select {
    font: inherit;
  }

  button {
    cursor: pointer;
    touch-action: manipulation;
    transition:
      transform .12s ease,
      background-color .15s ease,
      border-color .15s ease,
      box-shadow .15s ease,
      opacity .15s ease;
  }

  button:active {
    transform: scale(.97);
  }

  button:disabled {
    cursor: not-allowed;
    transform: none;
  }

  button:focus-visible,
  input:focus-visible,
  select:focus-visible {
    outline: 3px solid rgba(220, 38, 38, .16);
    outline-offset: 2px;
  }

  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  input[type="number"] {
    -moz-appearance: textfield;
  }


  /* =========================
     APP
  ========================= */

  .app {
    width: 100%;
    min-height: 100vh;
    max-width: 620px;
    margin: 0 auto;

    background: var(--page);

    display: flex;
    flex-direction: column;

    position: relative;
  }


  /* =========================
     HEADER
  ========================= */

  .brand {
    position: relative;
    overflow: hidden;

    padding:
      calc(20px + env(safe-area-inset-top))
      18px
      20px;

    color: #fff;

    background:
      radial-gradient(
        circle at 90% 0%,
        rgba(255,255,255,.16),
        transparent 34%
      ),
      linear-gradient(
        145deg,
        #7f1d1d 0%,
        #b91c1c 45%,
        #dc2626 100%
      );

    border-radius: 0 0 28px 28px;

    box-shadow:
      0 10px 30px rgba(153, 27, 27, .22);
  }

  .brand::after {
    content: "";
    position: absolute;

    width: 220px;
    height: 220px;

    right: -110px;
    bottom: -130px;

    border-radius: 50%;

    border: 35px solid rgba(255,255,255,.045);

    pointer-events: none;
  }

  .brand-row {
    position: relative;
    z-index: 1;

    display: flex;
    align-items: flex-start;
    justify-content: space-between;

    gap: 14px;
  }

  .eyebrow {
    margin-bottom: 4px;

    color: rgba(255,255,255,.7);

    font-size: 11px;
    font-weight: 800;

    letter-spacing: .14em;
    text-transform: uppercase;
  }

  .logo {
    margin-top: 2px;

    color: #fff;

    font-size: 30px;
    font-weight: 900;
    line-height: 1.15;

    letter-spacing: -.5px;
  }

  .status {
    min-height: 34px;

    flex: 0 0 auto;

    display: inline-flex;
    align-items: center;

    padding: 6px 11px;

    border: 1px solid rgba(255,255,255,.22);
    border-radius: 999px;

    background: rgba(255,255,255,.13);

    color: #fff;

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    font-size: 12px;
    font-weight: 800;

    white-space: nowrap;
  }


  /* =========================
     HEADER NOTICE
  ========================= */

  .notice {
    position: relative;
    z-index: 1;

    margin-top: 16px;

    min-height: 44px;

    display: flex;
    align-items: center;

    gap: 10px;

    padding: 10px 13px;

    border: 1px solid rgba(255,255,255,.15);
    border-radius: 13px;

    background: rgba(0,0,0,.10);

    color: rgba(255,255,255,.95);

    font-size: 13px;
    font-weight: 650;
    line-height: 1.4;
  }

  .notice-mark {
    width: 8px;
    height: 8px;

    flex: 0 0 auto;

    border-radius: 50%;

    background: #4ade80;

    box-shadow:
      0 0 0 5px rgba(74,222,128,.13);
  }


  /* =========================
     LIFF WARNING
  ========================= */

  .liff-gate {
    position: relative;
    z-index: 1;

    display: none;

    margin-top: 12px;
    padding: 12px;

    gap: 10px;

    align-items: center;
    justify-content: space-between;

    border-radius: 14px;

    background: rgba(0,0,0,.20);

    border: 1px solid rgba(255,255,255,.12);
  }

  .liff-gate.show {
    display: flex;
  }

  .liff-gate-text {
    color: #fff;

    font-size: 13px;
    font-weight: 700;

    line-height: 1.4;
  }

  .open-line {
    min-height: 42px;

    flex: 0 0 auto;

    border: 0;
    border-radius: 12px;

    padding: 8px 15px;

    background: var(--green);

    color: #fff;

    font-weight: 900;

    box-shadow:
      0 5px 14px rgba(6,199,85,.25);
  }


  /* =========================
     CONTENT
  ========================= */

  .content {
    width: 100%;

    display: grid;
    gap: 13px;

    padding: 16px 14px 18px;
  }


  /* =========================
     TOP BUTTONS
  ========================= */

  .topline {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;

    margin-top: -2px;
  }

  .back,
  .rules {
    min-height: 42px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 8px 12px;

    border-radius: 12px;

    font-size: 13px;
    font-weight: 800;
  }

  .back {
    border: 1px solid var(--line);

    background: #fff;

    color: var(--ink);

    box-shadow: var(--shadow-sm);
  }

  .rules {
    border: 1px solid var(--line-red);

    background: var(--red-soft);

    color: var(--red-dark);
  }


  /* =========================
     CARDS
  ========================= */

  .panel {
    width: 100%;

    padding: 14px;

    border: 1px solid rgba(228,228,231,.9);
    border-radius: var(--radius);

    background: var(--panel);

    box-shadow: var(--shadow-sm);
  }


  /* =========================
     LOTTO SELECT
  ========================= */

  .lotto-card {
    min-height: 68px;

    display: grid;

    grid-template-columns:
      minmax(0, 1fr)
      auto;

    align-items: center;

    gap: 10px;

    padding: 10px 12px 10px 15px;
  }

  select {
    min-width: 0;
    width: 100%;

    padding-right: 5px;

    border: 0;

    background: transparent;

    color: var(--ink);

    font-size: 19px;
    font-weight: 900;

    outline: none;
  }

  .close-time {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    min-height: 38px;

    padding: 7px 11px;

    border: 1px solid #fecaca;
    border-radius: 999px;

    background: var(--red-soft);

    color: var(--red-dark);

    font-size: 12px;
    font-weight: 900;

    white-space: nowrap;
  }


  /* =========================
     BET TYPE
  ========================= */

  .bet-grid {
    display: grid;

    grid-template-columns:
      repeat(3, minmax(0,1fr));

    gap: 8px;

    padding: 10px;
  }

  .bet-btn {
    position: relative;

    min-height: 54px;

    border: 1px solid var(--line);
    border-radius: 13px;

    background: #fff;

    color: var(--ink-soft);

    font-size: 15px;
    font-weight: 850;

    box-shadow:
      0 1px 2px rgba(0,0,0,.025);
  }

  .bet-btn:hover {
    border-color: #fca5a5;
    background: #fffafa;
  }

  .bet-btn.active,
  .bet-btn.two.active,
  .bet-btn.three.active {
    border-color: var(--red-main);

    background:
      linear-gradient(
        145deg,
        #b91c1c,
        #dc2626
      );

    color: #fff;

    box-shadow:
      0 6px 14px rgba(220,38,38,.22);
  }

  .bet-btn.active::after {
    content: "";

    position: absolute;

    top: 6px;
    right: 6px;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #fff;

    opacity: .9;
  }


  /* =========================
     CURRENT CHOICE
  ========================= */

  .choice-panel {
    display: grid;
    gap: 5px;

    padding: 13px 15px;

    background:
      linear-gradient(
        145deg,
        #fff,
        #fff7f7
      );
  }

  .choice-title {
    color: var(--muted);

    font-size: 11px;
    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: .05em;
  }

  .choice-value {
    min-height: 26px;

    color: var(--red-dark);

    font-size: 18px;
    font-weight: 900;

    line-height: 1.35;
  }


  /* =========================
     NUMBER INPUT DISPLAY
  ========================= */

  .digit-title {
    margin-top: 2px;

    text-align: center;

    color: var(--ink-soft);

    font-size: 13px;
    font-weight: 800;
  }

  .slots {
    min-height: 66px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 9px;
  }

  .slot {
    width: 58px;
    height: 64px;

    display: grid;
    place-items: center;

    border: 2px solid #fecaca;
    border-radius: 14px;

    background:
      linear-gradient(
        180deg,
        #fff,
        #fff7f7
      );

    color: var(--red-deep);

    font-size: 33px;
    font-weight: 950;

    font-variant-numeric: tabular-nums;

    box-shadow:
      0 4px 12px rgba(185,28,28,.07),
      inset 0 -2px 0 rgba(185,28,28,.04);
  }

  .slot:empty::after {
    content: "•";

    color: #fca5a5;

    font-size: 20px;
  }


  /* =========================
     KEYPAD
  ========================= */

  .keypad {
    display: grid;

    grid-template-columns:
      repeat(3, minmax(0, 1fr));

    gap: 8px;
  }

  .key {
    min-height: 59px;

    border: 1px solid #e4e4e7;
    border-radius: 14px;

    background: #fff;

    color: #18181b;

    font-size: 27px;
    font-weight: 850;

    font-variant-numeric: tabular-nums;

    box-shadow:
      0 3px 9px rgba(0,0,0,.035);
  }

  .key:hover {
    background: #fafafa;
  }

  .key:active {
    background: var(--red-soft);

    border-color: #fca5a5;

    color: var(--red-dark);
  }

  .key.wide {
    grid-column: span 2;
  }

  .key.danger {
    border-color: #fecaca;

    background: #fff1f2;

    color: #dc2626;

    font-size: 23px;
  }

  .key.dark {
    background: #18181b;

    color: #fff;

    font-size: 16px;
  }

  .key.gray {
    background: #f4f4f5;

    color: #52525b;

    font-size: 16px;
  }

  .key.blue {
    border-color: #fecaca;

    background: #fff1f2;

    color: var(--red-main);

    font-size: 16px;
  }


  /* =========================
     ENTRIES
  ========================= */

  .entries {
    display: grid;
    gap: 12px;
  }

  .entry-group {
    overflow: hidden;

    border: 1px solid var(--line);
    border-radius: var(--radius);

    background: var(--panel);

    box-shadow: var(--shadow-sm);
  }

  .entry-title {
    padding: 12px 14px;

    border-bottom: 1px solid #fee2e2;

    background:
      linear-gradient(
        90deg,
        #fff1f2,
        #fff
      );

    color: var(--red-dark);

    font-size: 16px;
    font-weight: 900;
  }

  .entry-table {
    width: 100%;

    border-collapse: collapse;

    table-layout: fixed;
  }

  .entry-table th {
    padding: 8px 4px;

    background: #fafafa;

    color: #a1a1aa;

    font-size: 10px;
    font-weight: 800;
  }

  .entry-table td {
    padding: 9px 4px;

    border-top: 1px solid #f4f4f5;

    background: #fff;

    text-align: center;

    color: #52525b;

    font-size: 13px;
  }

  .num-cell {
    color: var(--red-dark) !important;

    font-size: 21px !important;
    font-weight: 950 !important;

    font-variant-numeric: tabular-nums;
  }

  .entry-price-input {
    width: 76px;
    max-width: 100%;
    height: 38px;

    padding: 0 5px;

    border: 1px solid #d4d4d8;
    border-radius: 10px;

    background: #fff;

    color: var(--ink);

    font-size: 15px;
    font-weight: 900;

    text-align: center;

    font-variant-numeric: tabular-nums;
  }

  .entry-price-input:focus {
    outline: none;

    border-color: var(--red);

    box-shadow:
      0 0 0 3px rgba(220,38,38,.10);
  }

  .del {
    width: 36px;
    height: 36px;

    border: 0;
    border-radius: 10px;

    background: #fff1f2;

    color: #e11d48;

    font-size: 17px;
    font-weight: 900;
  }

  .del:hover {
    background: #ffe4e6;
  }


  /* =========================
     BOTTOM PAYMENT
  ========================= */

  .sticky-price {
    position: sticky;

    bottom: 0;

    z-index: 8;

    width: calc(100% - 16px);

    margin:
      auto
      8px
      calc(8px + env(safe-area-inset-bottom));

    padding: 13px;

    display: grid;
    gap: 11px;

    border: 1px solid rgba(228,228,231,.85);

    border-radius: 20px;

    background: rgba(255,255,255,.94);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
      0 -3px 18px rgba(0,0,0,.05),
      0 12px 35px rgba(0,0,0,.14);
  }

  .price-head {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;
  }

  .price-title {
    color: var(--ink);

    font-size: 17px;
    font-weight: 900;
  }

  .count-pill {
    padding: 6px 10px;

    border: 1px solid #fee2e2;
    border-radius: 999px;

    background: #fff1f2;

    color: var(--red-dark);

    font-size: 11px;
    font-weight: 900;
  }


  /* =========================
     BULK PRICE
  ========================= */

  .bulk-price {
    display: grid;
    gap: 7px;
  }

  .bulk-title {
    color: var(--muted);

    font-size: 11px;
    font-weight: 750;
  }

  .price-row {
    display: grid;

    grid-template-columns:
      minmax(80px,1fr)
      repeat(5,minmax(40px,auto));

    gap: 6px;
  }

  .price-input {
    min-width: 0;
    height: 46px;

    padding: 0 10px;

    border: 1.5px solid #d4d4d8;
    border-radius: 12px;

    background: #fff;

    color: var(--ink);

    font-size: 17px;
    font-weight: 900;

    text-align: center;

    font-variant-numeric: tabular-nums;
  }

  .price-input:focus {
    outline: 0;

    border-color: var(--red);

    box-shadow:
      0 0 0 3px rgba(220,38,38,.10);
  }

  .quick {
    min-width: 44px;

    border: 1px solid #fecaca;
    border-radius: 12px;

    background: #fff;

    color: var(--red-dark);

    font-size: 14px;
    font-weight: 900;
  }

  .quick:hover {
    background: var(--red-soft);
  }

  .quick:active {
    border-color: var(--red);

    background: var(--red);

    color: #fff;
  }


  /* =========================
     TOTAL
  ========================= */

  .totals {
    display: grid;
  }

  .total-box {
    min-height: 64px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 12px;

    padding: 10px 15px;

    border-radius: 15px;

    background:
      radial-gradient(
        circle at right top,
        rgba(255,255,255,.16),
        transparent 35%
      ),
      linear-gradient(
        135deg,
        #7f1d1d,
        #b91c1c 55%,
        #dc2626
      );

    color: #fff;

    box-shadow:
      0 8px 20px rgba(185,28,28,.20);
  }

  .total-label {
    color: rgba(255,255,255,.78);

    font-size: 12px;
    font-weight: 800;
  }

  .total-value {
    color: #fff;

    font-size: 25px;
    font-weight: 950;

    letter-spacing: -.3px;

    font-variant-numeric: tabular-nums;
  }

  .total-value::after {
    content: " ฿";

    font-size: 15px;
    font-weight: 800;

    opacity: .8;
  }


  /* =========================
     SUBMIT
  ========================= */

  .submit-row {
    display: grid;

    grid-template-columns:
      minmax(0,1.45fr)
      minmax(0,.75fr);

    gap: 8px;
  }

  .submit,
  .clear-all {
    min-height: 54px;

    border-radius: 14px;

    font-size: 16px;
    font-weight: 900;
  }

  .submit {
    border: 0;

    background:
      linear-gradient(
        135deg,
        #b91c1c,
        #dc2626
      );

    color: #fff;

    box-shadow:
      0 7px 18px rgba(220,38,38,.24);
  }

  .submit:hover {
    background:
      linear-gradient(
        135deg,
        #991b1b,
        #c8102e
      );
  }

  .submit:disabled {
    background: #d4d4d8;

    color: #fff;

    box-shadow: none;

    opacity: .85;
  }

  .clear-all {
    border: 1px solid #fecaca;

    background: #fff;

    color: #dc2626;
  }

  .clear-all:hover {
    background: #fff1f2;
  }

  .error {
    min-height: 18px;

    color: #dc2626;

    font-size: 12px;
    font-weight: 800;

    text-align: center;

    line-height: 1.4;
  }


  /* =========================
     LOADING
  ========================= */

  .loading {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: none;
    place-items: center;

    background: rgba(255,255,255,.72);

    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  .loading.show {
    display: grid;
  }

  .spinner {
    width: 48px;
    height: 48px;

    border: 5px solid #fee2e2;
    border-top-color: var(--red);

    border-radius: 50%;

    animation: spin .7s linear infinite;
  }


  /* =========================
     TOAST
  ========================= */

  .toast {
    position: fixed;

    top: calc(16px + env(safe-area-inset-top));
    left: 50%;

    z-index: 120;

    width: max-content;
    max-width: calc(100vw - 32px);

    padding: 10px 15px;

    border: 1px solid rgba(255,255,255,.15);
    border-radius: 999px;

    background: #18181b;

    color: #fff;

    box-shadow: var(--shadow-lg);

    font-size: 13px;
    font-weight: 850;

    opacity: 0;

    pointer-events: none;

    transform:
      translate(-50%, -10px)
      scale(.96);

    transition:
      opacity .18s ease,
      transform .18s ease;
  }

  .toast.show {
    opacity: 1;

    transform:
      translate(-50%, 0)
      scale(1);
  }


  /* =========================
     CONFIRM MODAL
  ========================= */

  .confirm-overlay {
    position: fixed;
    inset: 0;

    z-index: 90;

    display: none;

    align-items: flex-end;
    justify-content: center;

    padding: 0;

    background: rgba(0,0,0,.52);

    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
  }

  .confirm-overlay.show {
    display: flex;
  }

  .confirm-dialog {
    width: min(100%, 580px);
    max-height: 88vh;

    overflow: hidden;

    display: grid;

    grid-template-rows:
      auto
      minmax(0,1fr)
      auto;

    border-radius: 24px 24px 0 0;

    background: #fff;

    box-shadow:
      0 -12px 50px rgba(0,0,0,.25);
  }

  .confirm-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;

    gap: 12px;

    padding: 18px 18px 15px;

    border-bottom: 1px solid #f4f4f5;

    background: #fff;
  }

  .confirm-title {
    color: var(--ink);

    font-size: 20px;
    font-weight: 950;

    line-height: 1.2;
  }

  .confirm-subtitle {
    margin-top: 5px;

    color: var(--muted);

    font-size: 12px;
    font-weight: 700;

    line-height: 1.4;
  }

  .confirm-close {
    width: 38px;
    height: 38px;

    flex: 0 0 auto;

    border: 0;
    border-radius: 50%;

    background: #f4f4f5;

    color: #71717a;

    font-size: 24px;
    font-weight: 500;

    line-height: 1;
  }

  .confirm-body {
    overflow: auto;
    overscroll-behavior: contain;

    padding: 14px 16px;

    display: grid;
    gap: 12px;

    background: #fafafa;
  }


  /* =========================
     CONFIRM SUMMARY
  ========================= */

  .confirm-summary {
