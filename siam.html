<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#B91C1C">

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <title>ส่งโพยหวย</title>

  <style>
    :root {
      color-scheme: light;

      --red: #dc2626;
      --red-main: #c9142f;
      --red-dark: #991b2f;
      --red-deep: #701524;

      --red-soft: #fff1f2;
      --red-soft-2: #fff7f7;

      --green: #06c755;

      --ink: #18181b;
      --ink-soft: #3f3f46;
      --muted: #71717a;

      --line: #e4e4e7;
      --line-red: #fecdd3;

      --bg: #f5f5f7;
      --card: #ffffff;

      --shadow:
        0 7px 24px rgba(24,24,27,.06);

      --shadow-red:
        0 8px 22px rgba(201,20,47,.20);

      --radius: 18px;
      --radius-lg: 24px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(
          circle at top,
          rgba(220,38,38,.055),
          transparent 320px
        ),
        var(--bg);

      color: var(--ink);

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans Thai",
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;

      transition:
        transform .12s ease,
        background-color .15s ease,
        border-color .15s ease,
        opacity .15s ease;
    }

    button:active {
      transform: scale(.97);
    }

    button:disabled {
      cursor: not-allowed;
      transform: none;
    }

    input,
    select {
      outline: none;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .app {
      width: 100%;
      max-width: 680px;

      min-height: 100vh;

      margin: 0 auto;

      padding-bottom:
        calc(138px + env(safe-area-inset-bottom));
    }


    /* ===============================
       HEADER
    =============================== */

    .header {
      padding:
        calc(16px + env(safe-area-inset-top))
        14px
        18px;

      color: #fff;

      background:
        radial-gradient(
          circle at 95% 0%,
          rgba(255,255,255,.16),
          transparent 35%
        ),
        linear-gradient(
          145deg,
          #701524,
          #a8172d 50%,
          #dc263f
        );

      border-radius: 0 0 28px 28px;

      box-shadow:
        0 10px 30px rgba(153,27,47,.20);
    }

    .header-row {
      display: flex;

      align-items: flex-start;
      justify-content: space-between;

      gap: 12px;
    }

    .eyebrow {
      color: rgba(255,255,255,.65);

      font-size: 10px;
      font-weight: 850;

      letter-spacing: .12em;
    }

    .header-title {
      margin-top: 3px;

      font-size: 27px;
      font-weight: 950;

      line-height: 1.2;
    }

    .status {
      min-height: 32px;

      padding: 6px 10px;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255,255,255,.20);
      border-radius: 999px;

      background: rgba(255,255,255,.12);

      color: #fff;

      font-size: 11px;
      font-weight: 850;

      white-space: nowrap;

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .line-note {
      margin-top: 14px;

      min-height: 42px;

      padding: 9px 12px;

      display: flex;
      align-items: center;

      gap: 10px;

      border: 1px solid rgba(255,255,255,.13);
      border-radius: 13px;

      background: rgba(0,0,0,.10);

      color: rgba(255,255,255,.92);

      font-size: 12px;
      font-weight: 700;
    }

    .line-dot {
      width: 8px;
      height: 8px;

      flex: 0 0 auto;

      border-radius: 50%;

      background: #4ade80;

      box-shadow:
        0 0 0 5px rgba(74,222,128,.12);
    }


    /* ===============================
       LIFF GATE
    =============================== */

    .liff-gate {
      display: none;

      margin-top: 10px;

      padding: 10px;

      gap: 9px;

      align-items: center;
      justify-content: space-between;

      border-radius: 13px;

      background: rgba(0,0,0,.20);
    }

    .liff-gate.show {
      display: flex;
    }

    .liff-gate-text {
      color: #fff;

      font-size: 12px;
      font-weight: 700;

      line-height: 1.4;
    }

    .open-line {
      min-height: 40px;

      flex: 0 0 auto;

      padding: 7px 13px;

      border: 0;
      border-radius: 11px;

      background: var(--green);

      color: #fff;

      font-size: 12px;
      font-weight: 900;
    }


    /* ===============================
       CONTENT
    =============================== */

    .content {
      padding: 14px 12px;
    }


    /* ===============================
       LOTTO STICKY
    =============================== */

    .lotto-sticky {
      position: sticky;

      top: calc(7px + env(safe-area-inset-top));

      z-index: 35;
    }

    .lotto-card {
      position: relative;

      min-height: 72px;

      display: grid;

      grid-template-columns:
        minmax(0,1fr)
        auto;

      align-items: center;

      gap: 9px;

      padding: 10px 11px 10px 14px;

      overflow: hidden;

      border: 2px solid var(--red);
      border-radius: 17px;

      background: rgba(255,255,255,.96);

      box-shadow:
        0 8px 25px rgba(185,28,45,.15);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .lotto-card::before {
      content: "";

      position: absolute;

      left: 0;
      top: 12px;
      bottom: 12px;

      width: 4px;

      border-radius: 0 999px 999px 0;

      background: var(--red);
    }

    .lotto-select {
      min-width: 0;
      width: 100%;

      padding: 5px 3px 5px 5px;

      border: 0;

      background: transparent;

      color: var(--red-dark);

      font-size: 18px;
      font-weight: 950;
    }

    .close-wrap {
      display: grid;

      gap: 2px;

      justify-items: end;
    }

    .close-time {
      min-height: 35px;

      padding: 6px 9px;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      border-radius: 999px;

      background:
        linear-gradient(
          135deg,
          #b91c32,
          #dc263f
        );

      color: #fff;

      font-size: 11px;
      font-weight: 900;

      white-space: nowrap;
    }

    .countdown {
      color: var(--green);

      font-size: 10px;
      font-weight: 900;

      font-variant-numeric: tabular-nums;
    }


    /* ===============================
       MODE TABS
    =============================== */

    .mode-tabs {
      margin-top: 12px;

      padding: 4px;

      display: grid;

      grid-template-columns:
        repeat(4,minmax(0,1fr));

      gap: 3px;

      border: 1px solid var(--line);
      border-radius: 17px;

      background: #fff;

      box-shadow: var(--shadow);
    }

    .mode-btn {
      min-width: 0;
      min-height: 50px;

      padding: 4px 2px;

      border: 0;
      border-radius: 13px;

      background: transparent;

      color: #3f3f46;

      font-size: 13px;
      font-weight: 850;

      white-space: nowrap;
    }

    .mode-btn.active {
      background:
        linear-gradient(
          145deg,
          #ad1429,
          #df223c
        );

      color: #fff;

      box-shadow:
        0 5px 14px rgba(201,20,47,.20);
    }


    /* ===============================
       MAIN INPUT CARD
    =============================== */

    .panel {
      margin-top: 12px;

      padding: 14px;

      border: 1px solid var(--line);
      border-radius: var(--radius-lg);

      background: #fff;

      box-shadow: var(--shadow);
    }

    .panel-head {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;
    }

    .panel-title {
      font-size: 17px;
      font-weight: 950;
    }

    .number-count {
      padding: 5px 9px;

      border-radius: 999px;

      background: var(--red-soft);

      color: var(--red-main);

      font-size: 11px;
      font-weight: 900;
    }

    .input-help {
      margin-top: 4px;

      color: var(--muted);

      font-size: 11px;
      font-weight: 650;

      line-height: 1.4;
    }


    /* ===============================
       NUMBER INPUT
    =============================== */

    .number-input {
      width: 100%;
      height: 62px;

      margin-top: 11px;

      padding: 0 15px;

      border: 1.5px solid #d4d4d8;
      border-radius: 16px;

      background: #fff;

      color: #18181b;

      font-size: 21px;
      font-weight: 900;

      letter-spacing: .02em;

      font-variant-numeric: tabular-nums;
    }

    .number-input:focus {
      border-color: var(--red);

      box-shadow:
        0 0 0 3px rgba(220,38,38,.08);
    }

    .number-input::placeholder {
      color: #b4b4ba;

      font-size: 14px;
      font-weight: 650;

      letter-spacing: 0;
    }


    /* ===============================
       PREVIEW
    =============================== */

    .preview {
      margin-top: 14px;
    }

    .preview-head {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 8px;
    }

    .preview-label {
      color: #52525b;

      font-size: 12px;
      font-weight: 850;
    }

    .clear-preview {
      padding: 4px 7px;

      border: 0;

      background: transparent;

      color: #e11d48;

      font-size: 11px;
      font-weight: 850;
    }

    .chips {
      min-height: 62px;

      margin-top: 8px;

      display: flex;
      flex-wrap: wrap;

      align-content: flex-start;

      gap: 7px;
    }

    .chips.empty {
      align-items: center;
      justify-content: center;

      border: 1.5px dashed #e4e4e7;
      border-radius: 15px;

      background: #fafafa;
    }

    .empty-text {
      color: #a1a1aa;

      font-size: 12px;
      font-weight: 700;
    }

    .chip {
      min-width: 53px;
      height: 43px;

      padding: 0 9px;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      border: 0;
      border-radius: 12px;

      background:
        linear-gradient(
          145deg,
          #d71734,
          #ff304a
        );

      color: #fff;

      font-size: 17px;
      font-weight: 850;

      font-variant-numeric: tabular-nums;

      box-shadow:
        0 4px 10px rgba(225,29,53,.18);
    }

    .chip.locked {
      cursor: default;
    }

    .chip.locked:active {
      transform: none;
    }


    /* ===============================
       TOOLS
    =============================== */

    .tools {
      margin-top: 11px;

      display: flex;
      flex-wrap: wrap;

      gap: 7px;
    }

    .tool-btn {
      min-height: 43px;

      padding: 0 14px;

      border: 1px solid #d4d4d8;
      border-radius: 12px;

      background: #fff;

      color: #27272a;

      font-size: 13px;
      font-weight: 850;
    }

    .tool-btn.primary {
      border-color: var(--line-red);

      background: var(--red-soft);

      color: var(--red-main);
    }

    .tool-btn.hidden {
      display: none;
    }


    /* ===============================
       PRICE
    =============================== */

    .price-section {
      margin-top: 16px;

      padding-top: 14px;

      border-top: 1px solid #f1f1f1;
    }

    .price-title {
      color: #52525b;

      font-size: 12px;
      font-weight: 850;
    }

    .price-grid {
      margin-top: 7px;

      display: grid;

      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap: 8px;
    }

    .price-grid.one {
      grid-template-columns: 1fr;
    }

    .price-field {
      position: relative;
    }

    .price-field.hidden {
      display: none;
    }

    .price-input {
      width: 100%;
      height: 59px;

      padding: 20px 9px 5px;

      border: 1.5px solid #d4d4d8;
      border-radius: 15px;

      background: #fff;

      color: #18181b;

      text-align: center;

      font-size: 19px;
      font-weight: 950;

      font-variant-numeric: tabular-nums;
    }

    .price-input:focus {
      border-color: var(--red);

      box-shadow:
        0 0 0 3px rgba(220,38,38,.08);
    }

    .price-label {
      position: absolute;

      top: 6px;
      left: 0;
      right: 0;

      color: #a1a1aa;

      text-align: center;

      font-size: 10px;
      font-weight: 850;

      pointer-events: none;
    }


    /* ===============================
       LIVE TOTAL
    =============================== */

    .live-total {
      margin-top: 9px;

      min-height: 47px;

      padding: 8px 11px;

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      border-radius: 13px;

      background: #fafafa;
    }

    .live-total-label {
      color: #71717a;

      font-size: 11px;
      font-weight: 850;
    }

    .live-total-value {
      color: var(--red-main);

      font-size: 18px;
      font-weight: 950;

      font-variant-numeric: tabular-nums;
    }


    /* ===============================
       ADD BILL
    =============================== */

    .add-bill {
      width: 100%;
      min-height: 57px;

      margin-top: 10px;

      border: 0;
      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          #b7142c,
          #e9213d
        );

      color: #fff;

      font-size: 17px;
      font-weight: 950;

      box-shadow: var(--shadow-red);
    }

    .add-bill:disabled {
      background: #d4d4d8;

      box-shadow: none;
    }

    .error {
      min-height: 18px;

      margin-top: 7px;

      color: #dc2626;

      text-align: center;

      font-size: 11px;
      font-weight: 850;

      line-height: 1.4;
    }


    /* ===============================
       BILLS
    =============================== */

    .bills-section {
      margin-top: 13px;
    }

    .bills-head {
      padding: 0 2px 7px;

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;
    }

    .bills-title {
      font-size: 16px;
      font-weight: 950;
    }

    .bills-count {
      color: var(--muted);

      font-size: 11px;
      font-weight: 800;
    }

    .bill-list {
      display: grid;
      gap: 8px;
    }

    .bill-empty {
      padding: 22px;

      border: 1px dashed #d4d4d8;
      border-radius: 17px;

      background: rgba(255,255,255,.65);

      color: #a1a1aa;

      text-align: center;

      font-size: 12px;
      font-weight: 700;
    }

    .bill-card {
      overflow: hidden;

      border: 1px solid var(--line);
      border-radius: 17px;

      background: #fff;

      box-shadow:
        0 3px 14px rgba(0,0,0,.035);
    }

    .bill-head {
      padding: 10px 12px;

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      border-bottom: 1px solid #fee2e2;

      background:
        linear-gradient(
          90deg,
          #fff1f2,
          #fff
        );
    }

    .bill-mode {
      color: var(--red-main);

      font-size: 14px;
      font-weight: 950;
    }

    .bill-subtotal {
      font-size: 15px;
      font-weight: 950;

      white-space: nowrap;
    }

    .bill-body {
      padding: 10px 12px;
    }

    .bill-meta {
      margin-bottom: 5px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 750;
    }

    .bill-numbers {
      color: #3f3f46;

      font-size: 15px;
      font-weight: 850;

      line-height: 1.55;

      word-break: break-word;

      font-variant-numeric: tabular-nums;
    }

    .bill-foot {
      padding:
        0
        12px
        10px;

      display: flex;

      justify-content: flex-end;
    }

    .delete-bill {
      min-height: 34px;

      padding: 0 11px;

      border: 0;
      border-radius: 9px;

      background: var(--red-soft);

      color: #e11d48;

      font-size: 11px;
      font-weight: 850;
    }


    /* ===============================
       BOTTOM BAR
    =============================== */

    .bottom-bar {
      position: fixed;

      left: 50%;
      bottom: calc(7px + env(safe-area-inset-bottom));

      transform: translateX(-50%);

      z-index: 50;

      width: min(calc(100% - 14px),666px);

      padding: 9px;

      border: 1px solid rgba(228,228,231,.85);
      border-radius: 19px;

      background: rgba(255,255,255,.95);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 12px 38px rgba(0,0,0,.15);
    }

    .grand-total {
      min-height: 52px;

      padding: 8px 12px;

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      border-radius: 13px;

      background:
        radial-gradient(
          circle at right top,
          rgba(255,255,255,.12),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #701524,
          #b41630
        );

      color: #fff;
    }

    .grand-label {
      color: rgba(255,255,255,.72);

      font-size: 10px;
      font-weight: 850;
    }

    .grand-value {
      font-size: 21px;
      font-weight: 950;

      font-variant-numeric: tabular-nums;
    }

    .bottom-actions {
      margin-top: 7px;

      display: grid;

      grid-template-columns:
        .65fr
        1.35fr;

      gap: 7px;
    }

    .clear-bills,
    .submit-bills {
      min-height: 45px;

      border-radius: 12px;

      font-size: 13px;
      font-weight: 950;
    }

    .clear-bills {
      border: 1px solid var(--line-red);

      background: #fff;

      color: #e11d48;
    }

    .submit-bills {
      border: 0;

      background:
        linear-gradient(
          135deg,
          #b7142c,
          #e9213d
        );

      color: #fff;
    }


    /* ===============================
       CONFIRM
    =============================== */

    .confirm-overlay {
      position: fixed;
      inset: 0;

      z-index: 100;

      display: none;

      align-items: flex-end;
      justify-content: center;

      background: rgba(0,0,0,.55);

      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .confirm-overlay.show {
      display: flex;
    }

    .confirm-dialog {
      width: min(100%,600px);
      max-height: 88vh;

      overflow: hidden;

      display: grid;

      grid-template-rows:
        auto
        minmax(0,1fr)
        auto;

      border-radius: 24px 24px 0 0;

      background: #fff;

      box-shadow:
        0 -12px 50px rgba(0,0,0,.24);
    }

    .confirm-head {
      padding: 16px;

      display: flex;

      align-items: flex-start;
      justify-content: space-between;

      gap: 10px;

      border-bottom: 1px solid var(--line);
    }

    .confirm-title {
      font-size: 19px;
      font-weight: 950;
    }

    .confirm-subtitle {
      margin-top: 4px;

      color: var(--muted);

      font-size: 11px;
      font-weight: 700;
    }

    .confirm-close {
      width: 37px;
      height: 37px;

      flex: 0 0 auto;

      border: 0;
      border-radius: 50%;

      background: #f4f4f5;

      color: #52525b;

      font-size: 23px;
    }

    .confirm-body {
      padding: 13px;

      overflow: auto;

      display: grid;
      gap: 9px;

      background: #fafafa;
    }

    .confirm-summary {
      display: grid;

      grid-template-columns:
        repeat(3,minmax(0,1fr));

      gap: 7px;
    }

    .summary-box {
      min-width: 0;

      padding: 9px;

      border: 1px solid #fee2e2;
      border-radius: 12px;

      background: #fff;
    }

    .summary-label {
      color: var(--muted);

      font-size: 9px;
      font-weight: 800;
    }

    .summary-value {
      margin-top: 3px;

      overflow: hidden;

      color: var(--red-dark);

      font-size: 13px;
      font-weight: 950;

      text-overflow: ellipsis;
    }

    .confirm-group {
      overflow: hidden;

      border: 1px solid var(--line);
      border-radius: 14px;

      background: #fff;
    }

    .confirm-group-head {
      padding: 9px 11px;

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 9px;

      border-bottom: 1px solid #fee2e2;

      background:
        linear-gradient(
          90deg,
          #fff1f2,
          #fff
        );

      color: var(--red-main);

      font-size: 13px;
      font-weight: 950;
    }

    .confirm-group-meta {
      color: var(--muted);

      font-size: 10px;
      font-weight: 750;
    }

    .confirm-numbers {
      padding: 10px 11px;

      color: #3f3f46;

      font-size: 14px;
      font-weight: 850;

      line-height: 1.55;

      word-break: break-word;
    }

    .confirm-foot {
      padding:
        10px
        12px
        calc(10px + env(safe-area-inset-bottom));

      display: grid;

      grid-template-columns:
        .7fr
        1.3fr;

      gap: 8px;

      border-top: 1px solid var(--line);

      background: #fff;
    }

    .confirm-cancel,
    .confirm-submit {
      min-height: 50px;

      border-radius: 13px;

      font-size: 14px;
      font-weight: 950;
    }

    .confirm-cancel {
      border: 1px solid var(--line);

      background: #f4f4f5;

      color: #52525b;
    }

    .confirm-submit {
      border: 0;

      background:
        linear-gradient(
          135deg,
          #b7142c,
          #e9213d
        );

      color: #fff;
    }


    /* ===============================
       LOADING
    =============================== */

    .loading {
      position: fixed;
      inset: 0;

      z-index: 150;

      display: none;

      place-items: center;

      background: rgba(255,255,255,.72);

      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .loading.show {
      display: grid;
    }

    .spinner {
      width: 46px;
      height: 46px;

      border: 5px solid #fee2e2;
      border-top-color: var(--red);

      border-radius: 50%;

      animation: spin .7s linear infinite;
    }


    /* ===============================
       TOAST
    =============================== */

    .toast {
      position: fixed;

      top: calc(15px + env(safe-area-inset-top));
      left: 50%;

      z-index: 170;

      max-width: calc(100vw - 28px);

      padding: 9px 14px;

      border-radius: 999px;

      background: #18181b;

      color: #fff;

      font-size: 12px;
      font-weight: 850;

      opacity: 0;

      pointer-events: none;

      transform:
        translate(-50%,-8px)
        scale(.97);

      transition:
        .18s ease;
    }

    .toast.show {
      opacity: 1;

      transform:
        translate(-50%,0)
        scale(1);
    }


    @media (min-width: 600px) {

      body {
        padding-top: 18px;
      }

      .app {
        overflow: hidden;

        border: 1px solid var(--line);
        border-radius: 28px 28px 0 0;

        background: var(--bg);
      }

      .header {
        border-radius: 0 0 28px 28px;
      }

      .confirm-overlay {
        align-items: center;

        padding: 18px;
      }

      .confirm-dialog {
        border-radius: 24px;
      }

    }


    @media (max-width: 380px) {

      .mode-btn {
        font-size: 11px;
      }

      .lotto-select {
        font-size: 16px;
      }

      .confirm-summary {
        grid-template-columns: 1fr;
      }

    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }
  </style>
</head>

<script>

  /* ==========================================================
     CONFIG
  ========================================================== */

  var API =
    "https://script.google.com/macros/s/AKfycbxM3tDfZW_Xq5Du6UAp7qF3AkRwwq6qRt6x3xJ45SVVcXk_XtZJfRRVa6FvRSW5KOVWvA/exec";


  var LIFF_ID =
    "2001131713-hgaqA7mz";


  var MODES = {

    two: {
      label: "2 ตัว",
      len: 2,
      reverse: true,
      double: true,
      priceA: "บน",
      priceB: "ล่าง"
    },

    three: {
      label: "3 ตัว",
      len: 3,
      reverse: true,
      double: false,
      priceA: "ตรง",
      priceB: "โต๊ด"
    },

    six: {
      label: "6 กลับ",
      len: 3,
      reverse: false,
      double: false,
      priceA: "บนตรง",
      priceB: null
    },

    gate19: {
      label: "19 ประตู",
      len: 1,
      reverse: false,
      double: false,
      priceA: "บน",
      priceB: "ล่าง"
    }

  };


  var state = {

    liffReady: false,

    mode: "two",

    sourceNumbers: [],

    currentNumbers: [],

    bills: [],

    lottos: [],

    bank: null,

    pendingPayloads: null

  };


  var els = {};

  var liffUrl = "";

  var countdownTimer = null;

  var toastTimer = null;


  /* ==========================================================
     INIT
  ========================================================== */

  document.addEventListener(
    "DOMContentLoaded",
    function () {

      [
        "status",
        "liffGate",
        "liffGateText",
        "openLine",

        "lotto",
        "closeTime",
        "countdown",

        "numberInput",
        "inputHelp",

        "numberCount",
        "chips",
        "clearPreview",

        "reverseBtn",
        "doubleBtn",

        "priceGrid",
        "priceFieldB",
        "priceLabelA",
        "priceLabelB",
        "priceA",
        "priceB",

        "liveTotal",
        "addBill",
        "error",

        "billsCount",
        "billList",

        "grandTotal",
        "clearBills",
        "submitBills",

        "confirmOverlay",
        "confirmSubtitle",
        "confirmBody",
        "confirmClose",
        "confirmCancel",
        "confirmSend",

        "loading",
        "toast"

      ].forEach(
        function (id) {

          els[id] =
            document.getElementById(id);

        }
      );


      bindEvents();

      updateModeUI();

      renderCurrentNumbers();

      renderBills();

      apiGetBoot()
        .then(initBoot)
        .catch(showError);

    }
  );


  /* ==========================================================
     EVENTS
  ========================================================== */

  function bindEvents() {

    document
      .querySelectorAll("[data-mode]")
      .forEach(
        function (button) {

          button.addEventListener(
            "click",
            function () {

              setMode(
                button.dataset.mode
              );

            }
          );

        }
      );


    els.numberInput.addEventListener(
      "input",
      handleNumberInput
    );


    els.priceA.addEventListener(
      "input",
      updateLiveTotal
    );


    els.priceB.addEventListener(
      "input",
      updateLiveTotal
    );


    els.reverseBtn.addEventListener(
      "click",
      reverseNumbers
    );


    els.doubleBtn.addEventListener(
      "click",
      addDoubles
    );


    els.clearPreview.addEventListener(
      "click",
      clearCurrent
    );


    els.addBill.addEventListener(
      "click",
      addBill
    );


    els.clearBills.addEventListener(
      "click",
      clearAllBills
    );


    els.submitBills.addEventListener(
      "click",
      openConfirm
    );


    els.lotto.addEventListener(
      "change",
      function () {

        updateLottoInfo();

        clearError();

      }
    );


    els.openLine.addEventListener(
      "click",
      openInLine
    );


    els.confirmClose.addEventListener(
      "click",
      closeConfirm
    );


    els.confirmCancel.addEventListener(
      "click",
      closeConfirm
    );


    els.confirmSend.addEventListener(
      "click",
      confirmAndSend
    );


    els.confirmOverlay.addEventListener(
      "click",
      function (event) {

        if (
          event.target ===
          els.confirmOverlay
        ) {

          closeConfirm();

        }

      }
    );

  }


  /* ==========================================================
     API
  ========================================================== */

  function apiGetBoot() {

    return fetch(
      API + "?action=boot",
      {
        cache: "no-store"
      }
    )
    .then(readApiJson);

  }


  function apiCreateLiffOrder(payload) {

    return fetch(
      API,
      {

        method: "POST",

        headers: {
          "content-type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify({

          action:
            "createLiffOrder",

          payload:
            payload

        })

      }
    )
    .then(readApiJson);

  }


  function readApiJson(res) {

    return res
      .text()
      .then(
        function (text) {

          var data;

          try {

            data =
              text
                ? JSON.parse(text)
                : {};

          } catch (err) {

            throw new Error(
              text &&
              text.trim().charAt(0) === "<"
                ? "เชื่อมต่อ API ไม่สำเร็จ"
                : (
                    text ||
                    "เกิดข้อผิดพลาดจากเซิร์ฟเวอร์"
                  )
            );

          }


          if (
            !res.ok ||
            data.ok === false
          ) {

            throw new Error(
              data.error ||
              "เกิดข้อผิดพลาดจากเซิร์ฟเวอร์"
            );

          }


          return data;

        }
      );

  }


  /* ==========================================================
     BOOT
  ========================================================== */

  function initBoot(data) {

    state.lottos =
      data.lottos || [];


    state.bank =
      data.bank || null;


    renderLottos();


    initLiff(
      LIFF_ID
    );

  }


  function renderLottos() {

    els.lotto.innerHTML =
      "";


    var placeholder =
      document.createElement(
        "option"
      );


    placeholder.value =
      "";


    placeholder.textContent =
      "กรุณาเลือกหวย";


    els.lotto.appendChild(
      placeholder
    );


    state.lottos.forEach(
      function (lotto) {

        var option =
          document.createElement(
            "option"
          );


        option.value =
          lotto.name;


        option.textContent =
          lotto.name;


        option.dataset.closeTime =
          lotto.closeTime || "";


        els.lotto.appendChild(
          option
        );

      }
    );


    if (
      !state.lottos.length
    ) {

      var empty =
        document.createElement(
          "option"
        );


      empty.disabled =
        true;


      empty.textContent =
        "ยังไม่มีหวยที่เปิดรับ";


      els.lotto.appendChild(
        empty
      );

    }


    updateLottoInfo();

  }


  /* ==========================================================
     LOTTO INFO
  ========================================================== */

  function updateLottoInfo() {

    var option =
      els.lotto.selectedOptions[0];


    var closeTime =
      option
        ? (
            option.dataset.closeTime ||
            ""
          )
        : "";


    els.closeTime.textContent =
      closeTime
        ? (
            "ปิด " +
            closeTime
          )
        : "--:--";


    startCountdown(
      closeTime
    );

  }


  function startCountdown(closeTime) {

    clearInterval(
      countdownTimer
    );


    if (!closeTime) {

      els.countdown.textContent =
        "--:--:--";

      return;

    }


    updateCountdown(
      closeTime
    );


    countdownTimer =
      setInterval(
        function () {

          updateCountdown(
            closeTime
          );

        },
        1000
      );

  }


  function updateCountdown(closeTime) {

    var target =
      parseCloseTime(
        closeTime
      );


    if (!target) {

      els.countdown.textContent =
        "";

      return;

    }


    var diff =
      target.getTime() -
      Date.now();


    if (
      diff <= 0
    ) {

      els.countdown.textContent =
        "ปิดรับแล้ว";


      els.countdown.style.color =
        "#dc2626";

      return;

    }


    els.countdown.style.color =
      "#16a34a";


    var totalSeconds =
      Math.floor(
        diff / 1000
      );


    var hours =
      Math.floor(
        totalSeconds / 3600
      );


    var minutes =
      Math.floor(
        (
          totalSeconds %
          3600
        ) /
        60
      );


    var seconds =
      totalSeconds %
      60;


    els.countdown.textContent =
      pad2(hours) +
      ":" +
      pad2(minutes) +
      ":" +
      pad2(seconds);

  }


  function parseCloseTime(value) {

    value =
      String(
        value || ""
      ).trim();


    if (!value) {
      return null;
    }


    /*
     * ถ้า API ส่ง ISO / วันที่เต็ม
     */

    var direct =
      new Date(value);


    if (
      !isNaN(
        direct.getTime()
      ) &&
      /\d{4}/.test(value)
    ) {

      return direct;

    }


    /*
     * ถ้า API ส่ง HH:mm
     */

    var match =
      value.match(
        /(\d{1,2}):(\d{2})/
      );


    if (!match) {
      return null;
    }


    var date =
      new Date();


    date.setHours(
      Number(match[1]),
      Number(match[2]),
      0,
      0
    );


    return date;

  }


  /* ==========================================================
     LIFF
  ========================================================== */

  function initLiff(liffId) {

    liffUrl =
      "https://liff.line.me/" +
      encodeURIComponent(
        liffId
      );


    if (
      !window.liff ||
      !liff.init
    ) {

      els.status.textContent =
        "LIFF ไม่พร้อม";


      showLiffGate(
        "LIFF SDK ยังไม่พร้อม"
      );

      return;

    }


    liff.init({

      liffId:
        liffId,

      withLoginOnExternalBrowser:
        true

    })
    .then(
      function () {

        state.liffReady =
          true;


        if (
          liff.isInClient()
        ) {

          els.status.textContent =
            "พร้อมส่ง";


          hideLiffGate();

        } else {

          els.status.textContent =
            "หน้าเว็บ";


          showLiffGate(
            "ส่งโพยเข้าแชทต้องเปิดผ่าน LINE"
          );

        }

      }
    )
    .catch(
      function (err) {

        els.status.textContent =
          "LIFF ไม่พร้อม";


        showLiffGate(
          "กรุณาเปิดผ่าน LINE อีกครั้ง"
        );


        showError(
          err
        );

      }
    );

  }


  function canSendToChat() {

    return (
      state.liffReady &&
      window.liff &&
      typeof liff.sendMessages ===
        "function" &&
      liff.isInClient()
    );

  }


  function openInLine() {

    if (liffUrl) {

      window.location.href =
        liffUrl;

    }

  }


  function showLiffGate(message) {

    els.liffGateText.textContent =
      message;


    els.liffGate.classList.add(
      "show"
    );

  }


  function hideLiffGate() {

    els.liffGate.classList.remove(
      "show"
    );

  }


  /* ==========================================================
     MODE
  ========================================================== */

  function setMode(mode) {

    if (!MODES[mode]) {
      return;
    }


    state.mode =
      mode;


    clearCurrent();

    clearPrices();

    updateModeUI();

  }


  function updateModeUI() {

    var mode =
      MODES[state.mode];


    document
      .querySelectorAll("[data-mode]")
      .forEach(
        function (button) {

          button.classList.toggle(
            "active",
            button.dataset.mode ===
              state.mode
          );

        }
      );


    els.reverseBtn.classList.toggle(
      "hidden",
      !mode.reverse
    );


    els.doubleBtn.classList.toggle(
      "hidden",
      !mode.double
    );


    els.priceLabelA.textContent =
      mode.priceA;


    if (mode.priceB) {

      els.priceFieldB.classList.remove(
        "hidden"
      );


      els.priceGrid.classList.remove(
        "one"
      );


      els.priceLabelB.textContent =
        mode.priceB;

    } else {

      els.priceFieldB.classList.add(
        "hidden"
      );


      els.priceGrid.classList.add(
        "one"
      );

    }


    if (
      state.mode === "two"
    ) {

      els.inputHelp.textContent =
        "พิมพ์ 2 ตัว หรือวาง 82/89/80/83/84 ได้ทันที";


      els.numberInput.placeholder =
        "เช่น 82 หรือ 82/89/80/83";

    }


    if (
      state.mode === "three"
    ) {

      els.inputHelp.textContent =
        "พิมพ์ 3 ตัว หรือวาง 123/456/789 ได้ทันที";


      els.numberInput.placeholder =
        "เช่น 123 หรือ 123/456/789";

    }


    if (
      state.mode === "six"
    ) {

      els.inputHelp.textContent =
        "กรอกเลข 3 ตัว ระบบจะแสดงเลขกลับทั้งหมดให้อัตโนมัติ";


      els.numberInput.placeholder =
        "เช่น 123 หรือ 123/456";

    }


    if (
      state.mode === "gate19"
    ) {

      els.inputHelp.textContent =
        "กรอกเลขตั้งต้น 1 ตัว ระบบจะสร้าง 19 ประตูให้อัตโนมัติ";


      els.numberInput.placeholder =
        "เช่น 8";

    }


    els.numberInput.value =
      "";


    updateLiveTotal();

  }


  /* ==========================================================
     NUMBER INPUT + PASTE
  ========================================================== */

  function handleNumberInput() {

    clearError();


    var value =
      String(
        els.numberInput.value ||
        ""
      );


    var mode =
      MODES[state.mode];


    /*
     * มี / , space newline ฯลฯ
     * = ถือเป็นการวางหลายเลข
     */

    var hasSeparator =
      /[^\d]/.test(value);


    if (hasSeparator) {

      var numbers =
        extractNumbers(
          value,
          mode.len
        );


      if (
        numbers.length
      ) {

        numbers.forEach(
          function (number) {

            addSourceNumber(
              number
            );

          }
        );


        /*
         * วางเสร็จ
         * ล้างข้อความทันที
         */

        els.numberInput.value =
          "";

      }


      return;

    }


    /*
     * มีแต่ตัวเลข
     */

    var digits =
      value.replace(
        /\D/g,
        ""
      );


    /*
     * ถ้ายาวมากกว่าความยาวโหมด
     * เช่น paste 8289808384
     * แบ่งทีละ 2 ตัว
     */

    if (
      digits.length >
      mode.len
    ) {

      if (
        digits.length %
        mode.len ===
        0
      ) {

        var chunks =
          [];


        for (
          var i = 0;
          i < digits.length;
          i += mode.len
        ) {

          chunks.push(
            digits.slice(
              i,
              i + mode.len
            )
          );

        }


        chunks.forEach(
          function (number) {

            addSourceNumber(
              number
            );

          }
        );


        els.numberInput.value =
          "";

      }


      return;

    }


    /*
     * พิมพ์ครบ เช่น 12
     */

    if (
      digits.length ===
      mode.len
    ) {

      addSourceNumber(
        digits
      );


      els.numberInput.value =
        "";

    }

  }


  function extractNumbers(
    text,
    length
  ) {

    var raw =
      String(
        text || ""
      );


    /*
     * ดึงกลุ่มตัวเลขออกมาก่อน
     */

    var groups =
      raw.match(/\d+/g) ||
      [];


    var result =
      [];


    groups.forEach(
      function (group) {

        /*
         * กลุ่มตรงความยาว
         */

        if (
          group.length ===
          length
        ) {

          result.push(
            group
          );

          return;

        }


        /*
         * เช่น 828980
         * แบ่งเป็น 82 89 80
         */

        if (
          group.length >
            length &&
          group.length %
            length === 0
        ) {

          for (
            var i = 0;
            i < group.length;
            i += length
          ) {

            result.push(
              group.slice(
                i,
                i + length
              )
            );

          }

        }

      }
    );


    return unique(
      result
    );

  }


  /* ==========================================================
     ADD SOURCE
  ========================================================== */

  function addSourceNumber(number) {

    var mode =
      MODES[state.mode];


    number =
      String(
        number || ""
      )
      .replace(
        /\D/g,
        ""
      );


    if (
      number.length !==
      mode.len
    ) {

      return;

    }


    if (
      state.sourceNumbers.indexOf(
        number
      ) === -1
    ) {

      state.sourceNumbers.push(
        number
      );

    }


    /*
     * ==========================
     * 6 กลับ
     * ==========================
     *
     * 123 = 6
     * 112 = 3
     * 111 = 1
     */

    if (
      state.mode === "six"
    ) {

      rebuildSixNumbers();

      showToast(
        "เพิ่มเลขแล้ว"
      );

      return;

    }


    /*
     * ==========================
     * 19 ประตู
     * ==========================
     */

    if (
      state.mode === "gate19"
    ) {

      rebuildGateNumbers();

      showToast(
        "สร้าง 19 ประตูแล้ว"
      );

      return;

    }


    /*
     * ==========================
     * 2 ตัว / 3 ตัว
     * ==========================
     */

    if (
      state.currentNumbers.indexOf(
        number
      ) === -1
    ) {

      state.currentNumbers.push(
        number
      );

    }


    renderCurrentNumbers();

    updateLiveTotal();

  }


  /* ==========================================================
     6 กลับ CORRECT
  ========================================================== */

  function rebuildSixNumbers() {

    var expanded =
      [];


    state.sourceNumbers.forEach(
      function (number) {

        expanded =
          expanded.concat(
            getPermutations3(
              number
            )
          );

      }
    );


    state.currentNumbers =
      unique(
        expanded
      );


    renderCurrentNumbers();

    updateLiveTotal();

  }


  function getPermutations3(number) {

    number =
      String(
        number || ""
      );


    if (
      number.length !== 3
    ) {

      return [];

    }


    var a =
      number.charAt(0);


    var b =
      number.charAt(1);


    var c =
      number.charAt(2);


    return unique([

      a + b + c,

      a + c + b,

      b + a + c,

      b + c + a,

      c + a + b,

      c + b + a

    ]);

  }


  /* ==========================================================
     19 GATE
  ========================================================== */

  function rebuildGateNumbers() {

    var expanded =
      [];


    state.sourceNumbers.forEach(
      function (digit) {

        expanded =
          expanded.concat(
            get19GateNumbers(
              digit
            )
          );

      }
    );


    state.currentNumbers =
      unique(
        expanded
      );


    renderCurrentNumbers();

    updateLiveTotal();

  }


  function get19GateNumbers(digit) {

    var out =
      [];


    for (
      var i = 0;
      i <= 9;
      i++
    ) {

      var other =
        String(i);


      out.push(
        digit +
        other
      );


      if (
        other !==
        digit
      ) {

        out.push(
          other +
          digit
        );

      }

    }


    return unique(
      out
    );

  }


  /* ==========================================================
     REVERSE
  ========================================================== */

  function reverseNumbers() {

    clearError();


    if (
      !state.currentNumbers.length
    ) {

      showError(
        "กรุณากรอกเลขก่อน"
      );

      return;

    }


    /*
     * 2 ตัว
     */

    if (
      state.mode === "two"
    ) {

      var result =
        state.currentNumbers.slice();


      state.sourceNumbers.forEach(
        function (number) {

          result.push(
            number.charAt(1) +
            number.charAt(0)
          );

        }
      );


      state.currentNumbers =
        unique(
          result
        );

    }


    /*
     * 3 ตัว
     */

    if (
      state.mode === "three"
    ) {

      var threeResult =
        [];


      state.sourceNumbers.forEach(
        function (number) {

          threeResult =
            threeResult.concat(
              getPermutations3(
                number
              )
            );

        }
      );


      state.currentNumbers =
        unique(
          threeResult
        );

    }


    renderCurrentNumbers();

    updateLiveTotal();

  }


  /* ==========================================================
     DOUBLES
  ========================================================== */

  function addDoubles() {

    if (
      state.mode !== "two"
    ) {

      return;

    }


    for (
      var i = 0;
      i <= 9;
      i++
    ) {

      var number =
        String(i) +
        String(i);


      if (
        state.sourceNumbers.indexOf(
          number
        ) === -1
      ) {

        state.sourceNumbers.push(
          number
        );

      }


      if (
        state.currentNumbers.indexOf(
          number
        ) === -1
      ) {

        state.currentNumbers.push(
          number
        );

      }

    }


    renderCurrentNumbers();

    updateLiveTotal();

  }


  /* ==========================================================
     RENDER NUMBERS
  ========================================================== */

  function renderCurrentNumbers() {

    els.chips.innerHTML =
      "";


    if (
      !state.currentNumbers.length
    ) {

      els.chips.classList.add(
        "empty"
      );


      var empty =
        document.createElement(
          "span"
        );


      empty.className =
        "empty-text";


      empty.textContent =
        state.mode === "six"
          ? "กรอกเลข 3 ตัว ระบบจะกลับให้อัตโนมัติ"
          :
          state.mode === "gate19"
            ? "กรอกเลขตั้งต้น 1 ตัว"
            : "ยังไม่มีเลข";


      els.chips.appendChild(
        empty
      );

    } else {

      els.chips.classList.remove(
        "empty"
      );


      state.currentNumbers.forEach(
        function (number) {

          var chip;


          /*
           * 6กลับ / 19ประตู
           * ไม่ให้ลบเลขขยายทีละตัว
           * ป้องกันยอดไม่ตรงกับเลขตั้งต้น
           */

          if (
            state.mode === "six" ||
            state.mode === "gate19"
          ) {

            chip =
              document.createElement(
                "span"
              );


            chip.className =
              "chip locked";


          } else {

            chip =
              document.createElement(
                "button"
              );


            chip.type =
              "button";


            chip.className =
              "chip";


            chip.addEventListener(
              "click",
              function () {

                removePreviewNumber(
                  number
                );

              }
            );

          }


          chip.textContent =
            number;


          els.chips.appendChild(
            chip
          );

        }
      );

    }


    els.numberCount.textContent =
      state.currentNumbers.length +
      " ตัว";

  }


  function removePreviewNumber(
    number
  ) {

    state.currentNumbers =
      state.currentNumbers.filter(
        function (item) {

          return item !==
            number;

        }
      );


    /*
     * เอาออกจากต้นฉบับ
     * เฉพาะกรณีเลขนั้นเป็นเลขต้นฉบับ
     */

    state.sourceNumbers =
      state.sourceNumbers.filter(
        function (item) {

          return item !==
            number;

        }
      );


    renderCurrentNumbers();

    updateLiveTotal();

  }


  function clearCurrent() {

    state.sourceNumbers =
      [];


    state.currentNumbers =
      [];


    els.numberInput.value =
      "";


    renderCurrentNumbers();

    updateLiveTotal();

    clearError();

  }


  /* ==========================================================
     PRICE
  ========================================================== */

  function getPrice(value) {

    return (
      Number(
        value || 0
      ) ||
      0
    );

  }


  function clearPrices() {

    els.priceA.value =
      "";


    els.priceB.value =
      "";


    updateLiveTotal();

  }


  function updateLiveTotal() {

    var mode =
      MODES[state.mode];


    var a =
      getPrice(
        els.priceA.value
      );


    var b =
      mode.priceB
        ? getPrice(
            els.priceB.value
          )
        : 0;


    var count =
      state.currentNumbers.length;


    var total =
      count *
      (
        a +
        b
      );


    els.liveTotal.textContent =
      numberWithCommas(
        total
      ) +
      " บาท";


    els.addBill.disabled =
      (
        count === 0 ||
        (
          a <= 0 &&
          b <= 0
        )
      );

  }


  /* ==========================================================
     ADD BILL
  ========================================================== */

  function addBill() {

    clearError();


    if (
      !els.lotto.value
    ) {

      showError(
        "กรุณาเลือกหวยก่อน"
      );

      return;

    }


    if (
      !state.currentNumbers.length
    ) {

      showError(
        "กรุณากรอกเลขก่อน"
      );

      return;

    }


    var mode =
      MODES[state.mode];


    var a =
      getPrice(
        els.priceA.value
      );


    var b =
      mode.priceB
        ? getPrice(
            els.priceB.value
          )
        : 0;


    if (
      a <= 0 &&
      b <= 0
    ) {

      showError(
        "กรุณาใส่ราคา"
      );

      return;

    }


    var bill = {

      id:
        createId(),

      mode:
        state.mode,

      sourceNumbers:
        state.sourceNumbers.slice(),

      numbers:
        state.currentNumbers.slice(),

      priceA:
        a,

      priceB:
        b,

      subtotal:
        state.currentNumbers.length *
        (
          a +
          b
        )

    };


    state.bills.push(
      bill
    );


    clearCurrent();

    clearPrices();

    renderBills();

    showToast(
      "เพิ่มบิลแล้ว"
    );

  }


  /* ==========================================================
     BILL RENDER
  ========================================================== */

  function renderBills() {

    els.billList.innerHTML =

    if (
      !state.bills.length
    ) {

      var empty =
        document.createElement(
          "div"
        );


      empty.className =
        "bill-empty";


      empty.textContent =
        "ยังไม่มีบิล";


      els.billList.appendChild(
        empty
      );

    }


    state.bills.forEach(
      function (bill) {

        var card =
          document.createElement(
            "article"
          );


        card.className =

        var head =
          document.createElement(
            "div"
          );


        head.className =
          "bill-head";


        var mode =
          document.createElement(
            "div"
          );


        mode.className =
          "bill-mode";


        mode.textContent =
          MODES[bill.mode].label;


        var subtotal =
          document.createElement(
            "div"
          );


        subtotal.className =
          "bill-subtotal";


        subtotal.textContent =
          numberWithCommas(
            bill.subtotal
          ) +
          " บาท";


        head.appendChild(
          mode
        );


        head.appendChild(
          subtotal
        );


        var body =
          document.createElement(
            "div"
          );


        body.className =
          "bill-body";


        var meta =
          document.createElement(
            "div"
          );


        meta.className =
