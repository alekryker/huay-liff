<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#991B1B">

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <title>แทงหวย</title>

  <style>
    :root {
      color-scheme: light;

      --red: #e11d35;
      --red-main: #c9152d;
      --red-dark: #991b2e;
      --red-deep: #701524;

      --red-soft: #fff1f2;
      --red-soft-2: #fff7f8;

      --green: #22c55e;
      --line-green: #06c755;

      --ink: #18181b;
      --muted: #71717a;

      --line: #e4e4e7;
      --line-red: #fecdd3;

      --bg: #f5f5f7;
      --card: #ffffff;

      --radius: 18px;
      --radius-lg: 24px;

      --shadow:
        0 8px 26px rgba(24,24,27,.06);

      --shadow-red:
        0 10px 26px rgba(201,21,45,.20);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(
          circle at top,
          rgba(220,38,38,.06),
          transparent 330px
        ),
        var(--bg);

      color: var(--ink);

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans Thai",
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;

      transition:
        transform .12s ease,
        opacity .15s ease,
        background-color .15s ease,
        border-color .15s ease;
    }

    button:active {
      transform: scale(.97);
    }

    button:disabled {
      cursor: not-allowed;
      transform: none;
    }

    input,
    select {
      outline: none;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .app {
      width: 100%;
      max-width: 680px;

      min-height: 100vh;

      margin: 0 auto;

      padding-bottom:
        calc(140px + env(safe-area-inset-bottom));
    }


    /* ========================================================
       LOTTO HERO
    ======================================================== */

    .lotto-hero {
      position: relative;

      padding:
        calc(18px + env(safe-area-inset-top))
        14px
        22px;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(255,255,255,.17),
          transparent 36%
        ),
        radial-gradient(
          circle at 0% 100%,
          rgba(0,0,0,.12),
          transparent 44%
        ),
        linear-gradient(
          140deg,
          #771323 0%,
          #a81730 45%,
          #df2341 100%
        );

      border-radius:
        0
        0
        30px
        30px;

      box-shadow:
        0 12px 32px rgba(153,27,46,.23);
    }

    .lotto-hero::after {
      content: "";

      position: absolute;

      width: 230px;
      height: 230px;

      right: -125px;
      bottom: -150px;

      border-radius: 50%;

      border: 35px solid rgba(255,255,255,.035);

      pointer-events: none;
    }

    .lotto-heading {
      position: relative;
      z-index: 1;

      display: flex;
      align-items: flex-end;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 10px;
    }

    .lotto-label-small {
      color: rgba(255,255,255,.62);

      font-size: 10px;
      font-weight: 900;

      letter-spacing: .13em;
    }

    .lotto-heading-title {
      margin-top: 3px;

      color: #fff;

      font-size: 25px;
      font-weight: 950;

      line-height: 1.2;
    }

    .mini-status {
      display: none;
    }


    /* ========================================================
       LOTTO SELECT
    ======================================================== */

    .lotto-select-card {
      position: relative;
      z-index: 2;

      padding: 7px;

      border: 1px solid rgba(255,255,255,.17);
      border-radius: 18px;

      background: rgba(255,255,255,.13);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .lotto-select-inner {
      min-height: 67px;

      display: grid;

      grid-template-columns:
        minmax(0,1fr)
        auto;

      gap: 8px;

      align-items: center;

      padding:
        8px
        9px
        8px
        13px;

      border-radius: 14px;

      background: #fff;

      box-shadow:
        0 8px 22px rgba(80,0,15,.16);
    }

    .lotto-select {
      min-width: 0;
      width: 100%;

      border: 0;

      background: transparent;

      color: var(--red-dark);

      font-size: 18px;
      font-weight: 950;

      line-height: 1.3;
    }

    .lotto-select:disabled {
      opacity: 1;

      color: var(--red-dark);

      -webkit-text-fill-color: var(--red-dark);
    }

    .close-block {
      min-width: 78px;

      display: grid;

      justify-items: end;

      gap: 3px;
    }

    .close-time {
      min-height: 33px;

      padding: 6px 9px;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      border-radius: 999px;

      background:
        linear-gradient(
          135deg,
          #b4142c,
          #e11d3c
        );

      color: #fff;

      font-size: 10px;
      font-weight: 900;

      white-space: nowrap;
    }

    .countdown {
      color: var(--green);

      font-size: 10px;
      font-weight: 900;

      font-variant-numeric: tabular-nums;

      white-space: nowrap;
    }


    /* ========================================================
       LIFF GATE
    ======================================================== */

    .liff-gate {
      position: relative;
      z-index: 2;

      display: none;

      margin-top: 9px;

      padding: 10px;

      align-items: center;
      justify-content: space-between;

      gap: 9px;

      border-radius: 14px;

      background: rgba(0,0,0,.17);

      border: 1px solid rgba(255,255,255,.12);
    }

    .liff-gate.show {
      display: flex;
    }

    .liff-gate-text {
      color: #fff;

      font-size: 11px;
      font-weight: 750;

      line-height: 1.4;
    }

    .open-line {
      min-height: 39px;

      flex: 0 0 auto;

      padding: 6px 12px;

      border: 0;
      border-radius: 11px;

      background: #06c755;

      color: #fff;

      font-size: 11px;
      font-weight: 900;
    }


    /* ========================================================
       CONTENT
    ======================================================== */

    .content {
      padding:
        13px
        11px
        18px;
    }


    /* ========================================================
       MODE
    ======================================================== */

    .mode-sticky {
      position: sticky;

      top: calc(7px + env(safe-area-inset-top));

      z-index: 30;
    }

    .mode-tabs {
      padding: 4px;

      display: grid;

      grid-template-columns:
        repeat(4,minmax(0,1fr));

      gap: 3px;

      border: 1px solid rgba(228,228,231,.9);
      border-radius: 17px;

      background: rgba(255,255,255,.95);

      box-shadow:
        0 7px 22px rgba(0,0,0,.07);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .mode-btn {
      min-width: 0;
      min-height: 50px;

      padding: 4px 2px;

      border: 0;
      border-radius: 13px;

      background: transparent;

      color: #3f3f46;

      font-size: 13px;
      font-weight: 900;

      white-space: nowrap;
    }

    .mode-btn.active {
      background:
        linear-gradient(
          145deg,
          #aa1328,
          #e11d3b
        );

      color: #fff;

      box-shadow:
        0 5px 14px rgba(201,21,45,.20);
    }


    /* ========================================================
       PANEL
    ======================================================== */

    .panel {
      margin-top: 11px;

      padding: 14px;

      border: 1px solid var(--line);
      border-radius: var(--radius-lg);

      background: #fff;

      box-shadow: var(--shadow);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;
    }

    .panel-title {
      color: #18181b;

      font-size: 17px;
      font-weight: 950;
    }

    .number-count {
      padding: 5px 9px;

      border: 1px solid #fee2e2;
      border-radius: 999px;

      background: var(--red-soft);

      color: var(--red-main);

      font-size: 10px;
      font-weight: 900;
    }

    .input-help {
      margin-top: 4px;

      color: var(--muted);

      font-size: 11px;
      font-weight: 650;

      line-height: 1.4;
    }


    /* ========================================================
       NUMBER INPUT
    ======================================================== */

    .number-input-wrap {
      position: relative;

      margin-top: 10px;
    }

    .number-input {
      width: 100%;
      height: 62px;

      padding:
        0
        46px
        0
        15px;

      border: 1.5px solid #d4d4d8;
      border-radius: 16px;

      background: #fff;

      color: #18181b;

      font-size: 20px;
      font-weight: 900;

      font-variant-numeric: tabular-nums;
    }

    .number-input:focus {
      border-color: var(--red);

      box-shadow:
        0 0 0 3px rgba(225,29,53,.08);
    }

    .number-input::placeholder {
      color: #b4b4ba;

      font-size: 13px;
      font-weight: 650;
    }

    .input-icon {
      position: absolute;

      right: 13px;
      top: 50%;

      transform: translateY(-50%);

      width: 29px;
      height: 29px;

      display: grid;
      place-items: center;

      border-radius: 9px;

      background: var(--red-soft);

      color: var(--red-main);

      font-size: 12px;
      font-weight: 950;

      pointer-events: none;
    }


    /* ========================================================
       PREVIEW
    ======================================================== */

    .preview {
      margin-top: 14px;
    }

    .preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 8px;
    }

    .preview-title {
      color: #52525b;

      font-size: 12px;
      font-weight: 850;
    }

    .clear-preview {
      padding: 4px 7px;

      border: 0;

      background: transparent;

      color: #e11d48;

      font-size: 11px;
      font-weight: 900;
    }

    .chips {
      min-height: 61px;

      margin-top: 8px;

      display: flex;
      flex-wrap: wrap;

      align-content: flex-start;

      gap: 7px;
    }

    .chips.empty {
      align-items: center;
      justify-content: center;

      border: 1.5px dashed #e4e4e7;
      border-radius: 15px;

      background: #fafafa;
    }

    .empty-text {
      color: #a1a1aa;

      font-size: 12px;
      font-weight: 700;
    }

    .number-chip {
      min-width: 55px;
      height: 44px;

      padding: 0 9px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border: 0;
      border-radius: 12px;

      background:
        linear-gradient(
          145deg,
          #d51632,
          #ff304a
        );

      color: #fff;

      font-size: 17px;
      font-weight: 900;

      font-variant-numeric: tabular-nums;

      box-shadow:
        0 4px 11px rgba(225,29,53,.18);
    }

    .number-chip.locked {
      cursor: default;
    }


    /* ========================================================
       TOOLS
    ======================================================== */

    .tools {
      margin-top: 11px;

      display: flex;
      flex-wrap: wrap;

      gap: 7px;
    }

    .tool-btn {
      min-height: 43px;

      padding: 0 14px;

      border: 1px solid #d4d4d8;
      border-radius: 12px;

      background: #fff;

      color: #27272a;

      font-size: 13px;
      font-weight: 900;
    }

    .tool-btn.primary {
      border-color: var(--line-red);

      background: var(--red-soft);

      color: var(--red-main);
    }

    .tool-btn.active {
      border-color: var(--red-main);

      background: var(--red-main);

      color: #fff;
    }

    .tool-btn.hidden {
      display: none;
    }


    /* ========================================================
       PRICE
    ======================================================== */

    .price-section {
      margin-top: 16px;

      padding-top: 14px;

      border-top: 1px solid #f1f1f1;
    }

    .price-title {
      color: #52525b;

      font-size: 12px;
      font-weight: 850;
    }

    .price-grid {
      margin-top: 7px;

      display: grid;

      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap: 8px;
    }

    .price-grid.one {
      grid-template-columns: 1fr;
    }

    .price-field {
      position: relative;
    }

    .price-field.hidden {
      display: none;
    }

    .price-input {
      width: 100%;
      height: 59px;

      padding:
        20px
        9px
        5px;

      border: 1.5px solid #d4d4d8;
      border-radius: 15px;

      background: #fff;

      color: #18181b;

      text-align: center;

      font-size: 19px;
      font-weight: 950;

      font-variant-numeric: tabular-nums;
    }

    .price-input:focus {
      border-color: var(--red);

      box-shadow:
        0 0 0 3px rgba(225,29,53,.08);
    }

    .price-label {
      position: absolute;

      top: 6px;
      left: 0;
      right: 0;

      pointer-events: none;

      color: #a1a1aa;

      text-align: center;

      font-size: 10px;
      font-weight: 850;
    }


    /* ========================================================
       LIVE TOTAL
    ======================================================== */

    .live-total {
      margin-top: 9px;

      min-height: 50px;

      padding: 8px 12px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      border-radius: 14px;

      background:
        linear-gradient(
          90deg,
          #fafafa,
          #fff7f8
        );
    }

    .live-total-label {
      color: #71717a;

      font-size: 11px;
      font-weight: 850;
    }

    .live-total-value {
      color: var(--red-main);

      font-size: 20px;
      font-weight: 950;

      font-variant-numeric: tabular-nums;
    }


    /* ========================================================
       ADD BILL
    ======================================================== */

    .add-bill {
      width: 100%;
      min-height: 57px;

      margin-top: 10px;

      border: 0;
      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          #b3142b,
          #e9213d
        );

      color: #fff;

      font-size: 17px;
      font-weight: 950;

      box-shadow: var(--shadow-red);
    }

    .add-bill:disabled {
      background: #d4d4d8;

      box-shadow: none;
    }

    .error {
      min-height: 18px;

      margin-top: 7px;

      color: #dc2626;

      text-align: center;

      font-size: 11px;
      font-weight: 850;

      line-height: 1.4;
    }


    /* ========================================================
       BILLS
    ======================================================== */

    .bills-section {
      margin-top: 13px;
    }

    .bills-head {
      padding:
        0
        2px
        7px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;
    }

    .bills-title {
      font-size: 16px;
      font-weight: 950;
    }

    .bills-count {
      color: var(--muted);

      font-size: 11px;
      font-weight: 800;
    }

    .bill-list {
      display: grid;
      gap: 8px;
    }

    .bill-empty {
      padding: 22px;

      border: 1px dashed #d4d4d8;
      border-radius: 17px;

      background: rgba(255,255,255,.65);

      color: #a1a1aa;

      text-align: center;

      font-size: 12px;
      font-weight: 700;
    }

    .bill-card {
      overflow: hidden;

      border: 1px solid var(--line);
      border-radius: 17px;

      background: #fff;

      box-shadow:
        0 3px 14px rgba(0,0,0,.035);
    }

    .bill-head {
      padding: 10px 12px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      border-bottom: 1px solid #fee2e2;

      background:
        linear-gradient(
          90deg,
          #fff1f2,
          #fff
        );
    }

    .bill-mode {
      color: var(--red-main);

      font-size: 14px;
      font-weight: 950;
    }

    .bill-subtotal {
      font-size: 15px;
      font-weight: 950;

      white-space: nowrap;
    }

    .bill-body {
      padding: 10px 12px;
    }

    .bill-meta {
      margin-bottom: 5px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 750;

      line-height: 1.45;
    }

    .bill-numbers {
      color: #3f3f46;

      font-size: 15px;
      font-weight: 850;

      line-height: 1.55;

      word-break: break-word;

      font-variant-numeric: tabular-nums;
    }

    .bill-foot {
      padding:
        0
        12px
        10px;

      display: flex;

      justify-content: flex-end;
    }

    .delete-bill {
      min-height: 34px;

      padding: 0 11px;

      border: 0;
      border-radius: 9px;

      background: var(--red-soft);

      color: #e11d48;

      font-size: 11px;
      font-weight: 850;
    }


    /* ========================================================
       BOTTOM
    ======================================================== */

    .bottom-bar {
      position: fixed;

      left: 50%;
      bottom: calc(7px + env(safe-area-inset-bottom));

      transform: translateX(-50%);

      z-index: 50;

      width: min(
        calc(100% - 14px),
        666px
      );

      padding: 9px;

      border: 1px solid rgba(228,228,231,.86);
      border-radius: 19px;

      background: rgba(255,255,255,.95);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 12px 38px rgba(0,0,0,.15);
    }

    .grand-total {
      min-height: 52px;

      padding: 8px 12px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      border-radius: 13px;

      background:
        radial-gradient(
          circle at right top,
          rgba(255,255,255,.13),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #701524,
          #b41630
        );

      color: #fff;
    }

    .grand-label {
      color: rgba(255,255,255,.72);

      font-size: 10px;
      font-weight: 850;
    }

    .grand-value {
      font-size: 21px;
      font-weight: 950;

      font-variant-numeric: tabular-nums;
    }

    .bottom-actions {
      margin-top: 7px;

      display: grid;

      grid-template-columns:
        .65fr
        1.35fr;

      gap: 7px;
    }

    .clear-bills,
    .submit-bills {
      min-height: 45px;

      border-radius: 12px;

      font-size: 13px;
      font-weight: 950;
    }

    .clear-bills {
      border: 1px solid var(--line-red);

      background: #fff;

      color: #e11d48;
    }

    .submit-bills {
      border: 0;

      background:
        linear-gradient(
          135deg,
          #b7142c,
          #e9213d
        );

      color: #fff;
    }


    /* ========================================================
       CONFIRM
    ======================================================== */

    .confirm-overlay {
      position: fixed;
      inset: 0;

      z-index: 100;

      display: none;

      align-items: flex-end;
      justify-content: center;

      background: rgba(0,0,0,.55);

      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .confirm-overlay.show {
      display: flex;
    }

    .confirm-dialog {
      width: min(100%,600px);
      max-height: 88vh;

      overflow: hidden;

      display: grid;

      grid-template-rows:
        auto
        minmax(0,1fr)
        auto;

      border-radius:
        24px
        24px
        0
        0;

      background: #fff;

      box-shadow:
        0 -12px 50px rgba(0,0,0,.24);
    }

    .confirm-head {
      padding: 16px;

      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      gap: 10px;

      border-bottom: 1px solid var(--line);
    }

    .confirm-title {
      font-size: 19px;
      font-weight: 950;
    }

    .confirm-subtitle {
      margin-top: 4px;

      color: var(--muted);

      font-size: 11px;
      font-weight: 700;
    }

    .confirm-close {
      width: 37px;
      height: 37px;

      flex: 0 0 auto;

      border: 0;
      border-radius: 50%;

      background: #f4f4f5;

      color: #52525b;

      font-size: 23px;
    }

    .confirm-body {
      padding: 13px;

      overflow: auto;

      display: grid;
      gap: 9px;

      background: #fafafa;
    }

    .confirm-summary {
      display: grid;

      grid-template-columns:
        repeat(3,minmax(0,1fr));

      gap: 7px;
    }

    .summary-box {
      min-width: 0;

      padding: 9px;

      border: 1px solid #fee2e2;
      border-radius: 12px;

      background: #fff;
    }

    .summary-label {
      color: var(--muted);

      font-size: 9px;
      font-weight: 800;
    }

    .summary-value {
      margin-top: 3px;

      overflow: hidden;

      color: var(--red-dark);

      font-size: 13px;
      font-weight: 950;

      text-overflow: ellipsis;
    }

    .confirm-group {
      overflow: hidden;

      border: 1px solid var(--line);
      border-radius: 14px;

      background: #fff;
    }

    .confirm-group-head {
      padding: 9px 11px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 9px;

      border-bottom: 1px solid #fee2e2;

      background:
        linear-gradient(
          90deg,
          #fff1f2,
          #fff
        );

      color: var(--red-main);

      font-size: 13px;
      font-weight: 950;
    }

    .confirm-group-meta {
      color: var(--muted);

      font-size: 10px;
      font-weight: 750;

      text-align: right;
    }

    .confirm-numbers {
      padding: 10px 11px;

      color: #3f3f46;

      font-size: 14px;
      font-weight: 850;

      line-height: 1.55;

      word-break: break-word;
    }

    .confirm-foot {
      padding:
        10px
        12px
        calc(10px + env(safe-area-inset-bottom));

      display: grid;

      grid-template-columns:
        .7fr
        1.3fr;

      gap: 8px;

      border-top: 1px solid var(--line);

      background: #fff;
    }

    .confirm-cancel,
    .confirm-submit {
      min-height: 50px;

      border-radius: 13px;

      font-size: 14px;
      font-weight: 950;
    }

    .confirm-cancel {
      border: 1px solid var(--line);

      background: #f4f4f5;

      color: #52525b;
    }

    .confirm-submit {
      border: 0;

      background:
        linear-gradient(
          135deg,
          #b7142c,
          #e9213d
        );

      color: #fff;
    }


    /* ========================================================
       LOADING
    ======================================================== */

    .loading {
      position: fixed;
      inset: 0;

      z-index: 150;

      display: none;

      place-items: center;

      background: rgba(255,255,255,.72);

      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .loading.show {
      display: grid;
    }

    .spinner {
      width: 46px;
      height: 46px;

      border: 5px solid #fee2e2;
      border-top-color: var(--red);

      border-radius: 50%;

      animation:
        spin
        .7s
        linear
        infinite;
    }


    /* ========================================================
       TOAST
    ======================================================== */

    .toast {
      position: fixed;

      top: calc(14px + env(safe-area-inset-top));
      left: 50%;

      z-index: 170;

      max-width: calc(100vw - 28px);

      padding: 9px 14px;

      border-radius: 999px;

      background: #18181b;

      color: #fff;

      font-size: 12px;
      font-weight: 850;

      opacity: 0;

      pointer-events: none;

      transform:
        translate(-50%,-8px)
        scale(.97);

      transition: .18s ease;
    }

    .toast.show {
      opacity: 1;

      transform:
        translate(-50%,0)
        scale(1);
    }


    @media (min-width: 600px) {

      body {
        padding-top: 18px;
      }

      .app {
        overflow: hidden;

        border:
          1px
          solid
          var(--line);

        border-radius:
          28px
          28px
          0
          0;

        background: var(--bg);
      }

      .lotto-hero {
        border-radius:
          0
          0
          28px
          28px;
      }

      .confirm-overlay {
        align-items: center;

        padding: 18px;
      }

      .confirm-dialog {
        border-radius: 24px;
      }

    }


    @media (max-width: 380px) {

      .mode-btn {
        font-size: 11px;
      }

      .lotto-select {
        font-size: 16px;
      }

      .confirm-summary {
        grid-template-columns: 1fr;
      }

    }


    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<script>

  /* =========================================================
     CONFIG
  ========================================================= */

  var API =
    "https://script.google.com/macros/s/AKfycbxM3tDfZW_Xq5Du6UAp7qF3AkRwwq6qRt6x3xJ45SVVcXk_XtZJfRRVa6FvRSW5KOVWvA/exec";


  var LIFF_ID =
    "2001131713-hgaqA7mz";


  var MODES = {

    two: {

      label:
        "2 ตัว",

      len:
        2,

      reverse:
        true,

      double:
        true,

      priceA:
        "บน",

      priceB:

    },


    three: {

        "3 ตัว",

      len:
        3,

      reverse:
        true,

      double:
        false,

      priceA:

      priceB:
        "โต๊ด"

    },


    six: {

        "6 กลับ",

      len:
        3,

      reverse:
        false,

      double:

      priceB:
        null

    },


    gate19: {

      label:
        "19 ประตู",

      len:
        1,

      reverse:
        false,

      double:
        false,

      priceA:
        "บน",

      priceB:
        "ล่าง"

    }

  };


  /* =========================================================
     STATE
  ========================================================= */

  var state = {

    liffReady:
      false,

    mode:
      "two",


    /*
     * เลขต้นฉบับที่ผู้ใช้กรอก
     */

    sourceNumbers:
      [],


    /*
     * เลขสำหรับแสดง
     *
     * ตัดเลขซ้ำได้
     */

    currentNumbers:
      [],


    /*
     * รายการเดิมพันจริง
     *
     * ห้าม unique ข้าม source
     *
     * ใช้ตัวนี้ในการคำนวณเงิน
     */

    betNumbers:
      [],


    twoReverseActive:
      false,

    threeReverseActive:
      false,


    bills:
      [],

    lottos:
      [],

    bank:
      null,

    pendingPayloads:
      null

  };


  var els =
    {};


  var liffUrl =
    "";


  var countdownTimer =
    null;


  var toastTimer =
    null;


  /* =========================================================
     INIT
  ========================================================= */

  document.addEventListener(
    "DOMContentLoaded",
    function () {

      [
        "status",

        "lotto",
        "closeTime",
        "countdown",

        "liffGate",
        "liffGateText",
        "openLine",

        "numberInput",
        "inputHelp",

        "numberCount",
        "chips",
        "clearPreview",

        "reverseBtn",
        "doubleBtn",

        "priceGrid",
        "priceFieldB",
        "priceLabelA",
        "priceLabelB",
        "priceA",
        "priceB",

        "liveTotal",
        "addBill",
        "error",

        "billsCount",
        "billList",

        "grandTotal",
        "clearBills",
        "submitBills",

        "confirmOverlay",
        "confirmSubtitle",
        "confirmBody",
        "confirmClose",
        "confirmCancel",
        "confirmSend",

        "loading",
        "toast"

      ].forEach(
        function (id) {

          els[id] =
            document.getElementById(
              id
            );

        }
      );


      bindEvents();

      updateModeUI();

      renderCurrentNumbers();

      renderBills();


      apiGetBoot()
        .then(
          initBoot
        )
        .catch(
          showError
        );

    }
  );


  /* =========================================================
     EVENTS
  ========================================================= */

  function bindEvents() {

    document
      .querySelectorAll(
        "[data-mode]"
      )
      .forEach(
        function (button) {

          button.addEventListener(
            "click",
            function () {

              setMode(
                button.dataset.mode
              );

            }
          );

        }
      );


    els.numberInput.addEventListener(
      "input",
      handleNumberInput
    );


    els.priceA.addEventListener(
      "input",
      updateLiveTotal
    );


    els.priceB.addEventListener(
      "input",
      updateLiveTotal
    );


    els.reverseBtn.addEventListener(
      "click",
      reverseNumbers
    );


    els.doubleBtn.addEventListener(
      "click",
      addDoubles
    );


    els.clearPreview.addEventListener(
      "click",
      clearCurrent
    );


    els.addBill.addEventListener(
      "click",
      addBill
    );


    els.clearBills.addEventListener(
      "click",
      clearAllBills
    );


    els.submitBills.addEventListener(
      "click",
      openConfirm
    );


    els.lotto.addEventListener(
      "change",
      function () {

        updateLottoInfo();

        clearError();

      }
    );


    els.openLine.addEventListener(
      "click",
      openInLine
    );


    els.confirmClose.addEventListener(
      "click",
      closeConfirm
    );


    els.confirmCancel.addEventListener(
      "click",
      closeConfirm
    );


    els.confirmSend.addEventListener(
      "click",
      confirmAndSend
    );


    els.confirmOverlay.addEventListener(
      "click",
      function (event) {

        if (
          event.target ===
          els.confirmOverlay
        ) {

          closeConfirm();

        }

      }
    );

  }


  /* =========================================================
     API
  ========================================================= */

  function apiGetBoot() {

    return fetch(
      API + "?action=boot",
      {
        cache:
          "no-store"
      }
    )
    .then(
      readApiJson
    );

  }


  function apiCreateLiffOrder(
    payload
  ) {

    return fetch(
      API,
      {

        method:
          "POST",

        headers: {

          "content-type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify({

            action:
              "createLiffOrder",

            payload:
              payload

          })

      }
    )
    .then(
      readApiJson
    );

  }


  function readApiJson(
    res
  ) {

    return res
      .text()
      .then(
        function (text) {

          var data;


          try {

            data =
              text
                ? JSON.parse(text)
                : {};

          } catch (err) {

            throw new Error(

              text &&
              text
                .trim()
                .charAt(0) === "<"

                ? "เชื่อมต่อ API ไม่สำเร็จ"

                : (
                    text ||
                    "เกิดข้อผิดพลาดจากเซิร์ฟเวอร์"
                  )

            );

          }


          if (
            !res.ok ||
            data.ok === false
          ) {

            throw new Error(
              data.error ||
              "เกิดข้อผิดพลาดจากเซิร์ฟเวอร์"
            );

          }


          return data;

        }
      );

  }


  /* =========================================================
     BOOT
  ========================================================= */

  function initBoot(
    data
  ) {

    state.lottos =
      data.lottos ||
      [];


    state.bank =
      data.bank ||
      null;


    renderLottos();


    initLiff(
      LIFF_ID
    );

  }


  function renderLottos() {

    els.lotto.innerHTML =
      "";


    var placeholder =
      document.createElement(
        "option"
      );


    placeholder.value =
      "";


    placeholder.textContent =
      "กรุณาเลือกหวย";


    els.lotto.appendChild(
      placeholder
    );


    state.lottos.forEach(
      function (lotto) {

        var option =
          document.createElement(
            "option"
          );


        option.value =
          lotto.name;


        option.textContent =
          lotto.name;


        option.dataset.closeTime =
          lotto.closeTime ||
          "";


        option.dataset.closeAt =
          lotto.closeAt ||
          lotto.closeDateTime ||
          lotto.closeDatetime ||
          "";


        option.dataset.drawDate =
          lotto.drawDate ||
          lotto.date ||
          "";


        els.lotto.appendChild(
          option
        );

      }
    );


    if (
      !state.lottos.length
    ) {

      var empty =
        document.createElement(
          "option"
        );


      empty.value =
        "";


      empty.textContent =
        "ยังไม่มีหวยที่เปิดรับ";


      empty.disabled =
        true;


      els.lotto.appendChild(
        empty
      );

    }


    updateLottoInfo();

  }


  /* =========================================================
     LOTTO INFO
  ========================================================= */

  function updateLottoInfo() {

    var option =
      els.lotto.selectedOptions[0];


    var closeTime =
      option
        ? (
            option.dataset.closeTime ||
            ""
          )
        : "";


    els.closeTime.textContent =
      closeTime
        ? (
            "ปิด " +
            closeTime
          )
        : "--:--";


    startCountdown(
      option
    );

  }


  function startCountdown(
    option
  ) {

    clearInterval(
      countdownTimer
    );


    if (
      !option ||
      !option.value
    ) {

      els.countdown.textContent =
        "--:--:--";

      return;

    }


    updateCountdown(
      option
    );


    countdownTimer =
      setInterval(
        function () {

          updateCountdown(
            option
          );

        },
        1000
      );

  }


  function updateCountdown(
    option
  ) {

    var target =
      getCloseTarget(
        option
      );


    if (!target) {

      els.countdown.textContent =
        "";

      return;

    }


    var diff =
      target.getTime() -
      Date.now();


    if (
      diff <= 0
    ) {

      els.countdown.textContent =
        "ปิดรับแล้ว";


      els.countdown.style.color =
        "#fecaca";


      return;

    }


    els.countdown.style.color =
      "#4ade80";


    var totalSeconds =
      Math.floor(
        diff / 1000
      );


    var hours =
      Math.floor(
        totalSeconds /
        3600
      );


    var minutes =
      Math.floor(
        (
          totalSeconds %
          3600
        ) /
        60
      );


    var seconds =
      totalSeconds %
      60;


    els.countdown.textContent =
      pad2(hours) +
      ":" +
      pad2(minutes) +
      ":" +
      pad2(seconds);

  }


  function getCloseTarget(
    option
  ) {

    if (!option) {
      return null;
    }


    var closeAt =
      String(
        option.dataset.closeAt ||
        ""
      ).trim();


    if (closeAt) {

      var parsed =
        parseDateTimeValue(
          closeAt
        );


      if (parsed) {
        return parsed;
      }

    }


    var closeTime =
      String(
        option.dataset.closeTime ||
        ""
      ).trim();


    if (!closeTime) {
      return null;
    }


    var match =
      closeTime.match(
        /(\d{1,2}):(\d{2})/
      );


    if (!match) {
      return null;
    }


    var now =
      new Date();


    var target =
      new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate(),
        Number(match[1]),
        Number(match[2]),
        0,
        0
      );


    return target;

  }


  function parseDateTimeValue(
    value
  ) {

    value =
      String(
        value || ""
      ).trim();


    if (!value) {
      return null;
    }


    var direct =
      new Date(
        value
      );


    if (
      !isNaN(
        direct.getTime()
      )
    ) {

      return direct;

    }


    /*
     * DD-MM-YYYY HH:mm
     */

    var dmy =
      value.match(
        /(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})\s+(\d{1,2}):(\d{2})/
      );


    if (dmy) {

      return new Date(

        Number(dmy[3]),

        Number(dmy[2]) - 1,

        Number(dmy[1]),

        Number(dmy[4]),

        Number(dmy[5]),

        0,

        0

      );

    }


    return null;

  }


  /* =========================================================
     LIFF
  ========================================================= */

  function initLiff(
    liffId
  ) {

    liffUrl =
      "https://liff.line.me/" +
      encodeURIComponent(
        liffId
      );


    if (
      !window.liff ||
      !liff.init
    ) {

      els.status.textContent =
        "LIFF ไม่พร้อม";

        "LIFF SDK ยังไม่พร้อม กรุณาเปิดผ่าน LINE"
      );

      return;

    }


    liff.init({

      liffId:
        liffId,

      withLoginOnExternalBrowser:
        true

    })
    .then(
      function () {

        state.liffReady =
          true;


        if (
          liff.isInClient()
        ) {

          els.status.textContent =
            "พร้อมส่ง";


          hideLiffGate();

        } else {

          els.status.textContent =
            "หน้าเว็บ";

            "ต้องเปิดผ่าน LINE ก่อนยืนยันส่งโพย"

        }

      }
    )
    .catch(

    );

  /* =========================================================
     NUMBER INPUT
  ========================================================= */

  function handleNumberInput() {

    clearError();


    var mode =
      MODES[state.mode];


    var raw =
      String(
        els.numberInput.value ||
        ""
      );


    /*
     * ============================
     * 19 ประตู
     * ไม่รับโพยหลายเลข
     * ============================
     */

    if (
      state.mode === "gate19"
    ) {

      if (
        /[^\d]/.test(raw)
      ) {

        els.numberInput.value =
          "";


        showError(
          "19 ประตู กรุณากรอกเลขตั้งต้นทีละ 1 ตัว"
        );

        return;

      }


      var gateDigits =
        raw.replace(
          /\D/g,
          ""
        );


      if (
        gateDigits.length > 1
      ) {

        els.numberInput.value =
          "";


        showError(
          "19 ประตู กรุณากรอกทีละ 1 ตัว"
        );

        return;

      }


      if (
        gateDigits.length === 1
      ) {

        addSourceNumber(
          gateDigits
        );


        els.numberInput.value =
          "";

      }


      return;

    }


    /*
     * ============================
     * มีตัวคั่น
     * = Paste หลายเลข
     * ============================
     */

    if (
      /[^\d]/.test(raw)
    ) {

      var numbers =
        extractNumbers(
          raw,
          mode.len
        );


      if (
        numbers.length
      ) {

        numbers.forEach(
          function (number) {

            addSourceNumber(
              number
            );

          }
        );


        /*
         * วางเสร็จแล้วหายทันที
         */

        els.numberInput.value =
          "";

      }


      return;

    }


    /*
     * ============================
     * มีแต่ตัวเลข
     * ============================
     */

    var digits =
      raw.replace(
        /\D/g,
        ""
      );


    /*
     * Paste ติดกัน
     *
     * 82898083
     * =
     * 82 89 80 83
     */

    if (
      digits.length >
      mode.len
    ) {

      if (
        digits.length %
        mode.len ===
        0
      ) {

        var chunks =
          [];


        for (
          var i = 0;
          i < digits.length;
          i += mode.len
        ) {

          chunks.push(
            digits.slice(
              i,
              i + mode.len
            )
          );

        }


        chunks.forEach(
          function (number) {

            addSourceNumber(
              number
            );

          }
        );


        els.numberInput.value =
          "";

      }


      return;

    }


    /*
     * พิมพ์ครบ
     */

    if (
      digits.length ===
      mode.len
    ) {

      addSourceNumber(
        digits
      );


      els.numberInput.value =
        "";

    }

  }


  function extractNumbers(
    text,
    length
  ) {

    var groups =
      String(
        text || ""
      )
      .match(
        /\d+/g
      ) ||
      [];


    var result =
      [];


    groups.forEach(
      function (group) {

        if (
          group.length ===
          length
        ) {

          result.push(
            group
          );

          return;

        }


        /*
         * 828980
         * len 2
         * =
         * 82 89 80
         */

        if (
          group.length >
          length &&
          group.length %
          length === 0
        ) {

          for (
            var i = 0;
            i < group.length;
            i += length
          ) {

            result.push(
              group.slice(
                i,
                i + length
              )
            );

          }

        }

      }
    );


    return unique(
      result
    );

  }


  /* =========================================================
     ADD SOURCE
  ========================================================= */

  function addSourceNumber(
    number
  ) {

    var mode =
      MODES[state.mode];


    number =
      String(
        number || ""
      )
      .replace(
        /\D/g,
        ""
      );


    if (
      number.length !==
      mode.len
    ) {

      return;

    }


    /*
     * ไม่รับ source เดิมซ้ำ
     */

    if (
      state.sourceNumbers.indexOf(
        number
      ) !== -1
    ) {

      return;

    }


    state.sourceNumbers.push(
      number
    );


    /* ==========================
       2 ตัว
    ========================== */

    if (
      state.mode === "two"
    ) {

      if (
        state.twoReverseActive
      ) {

        rebuildTwoReverseNumbers();

      } else {

        rebuildSimpleNumbers();

      }


      return;

    }


    /* ==========================
       3 ตัว
    ========================== */

    if (
      state.mode === "three"
    ) {

      if (
        state.threeReverseActive
      ) {

        rebuildThreeReverseNumbers();

      } else {

        rebuildSimpleNumbers();

      }


      return;

    }


    /* ==========================
       6 กลับ
    ========================== */

    if (
      state.mode === "six"
    ) {

      rebuildSixNumbers();

      return;

    }


    /* ==========================
       19 ประตู
    ========================== */

    if (
      state.mode === "gate19"
    ) {

      rebuildGateNumbers();

      return;

    }

  }


  /* =========================================================
     NORMAL
  ========================================================= */

  function rebuildSimpleNumbers() {

    state.betNumbers =
      state.sourceNumbers.slice();


    state.currentNumbers =
      unique(
        state.betNumbers
      );


    renderCurrentNumbers();

    updateLiveTotal();

  }


  /* =========================================================
     2 ตัว กลับเลข
  ========================================================= */

  function rebuildTwoReverseNumbers() {

    var bets =
      [];


    state.sourceNumbers.forEach(
      function (sourceNumber) {

        var reversed =
          sourceNumber.charAt(1) +
          sourceNumber.charAt(0);


        /*
         * 12
         * =
         * 12 21
         *
         * 11
         * =
         * 11
         */

        bets.push(
          sourceNumber
        );


        if (
          reversed !==
          sourceNumber
        ) {

          bets.push(
            reversed
          );

        }

      }
    );


    /*
     * สำคัญ:
     *
     * betNumbers ห้าม unique
     * ข้าม source
     */

    state.betNumbers =
      bets;


    /*
     * currentNumbers
     * สำหรับแสดงผลเท่านั้น
     */

    state.currentNumbers =
      unique(
        bets
      );


    renderCurrentNumbers();

    updateLiveTotal();

  }


  /* =========================================================
     3 ตัว PERMUTATIONS
  ========================================================= */

  function getPermutations3(
    number
  ) {

    number =
      String(
        number || ""
      )
      .replace(
        /\D/g,
        ""
      );


    if (
      number.length !==
      3
    ) {

      return [];

    }


    var a =
      number.charAt(0);


    var b =
      number.charAt(1);


    var c =
      number.charAt(2);


    /*
     * unique เฉพาะ source เดียว
     *
     * 123 = 6
     * 112 = 3
     * 111 = 1
     */

    return unique([

      a + b + c,

      a + c + b,

      b + a + c,

      b + c + a,

      c + a + b,

      c + b + a

    ]);

  }


  /* =========================================================
     3 ตัว กลับเลข
  ========================================================= */

  function rebuildThreeReverseNumbers() {

    var bets =
      [];


    state.sourceNumbers.forEach(
      function (sourceNumber) {

        /*
         * ห้าม unique ระหว่าง
         * คนละเลขต้นฉบับ
         */

        bets =
          bets.concat(
            getPermutations3(
              sourceNumber
            )
          );

      }
    );


    state.betNumbers =
      bets;


    state.currentNumbers =
      unique(
        bets
      );


    renderCurrentNumbers();

    updateLiveTotal();

  }


  /* =========================================================
     6 กลับ
  ========================================================= */

  function rebuildSixNumbers() {

    var bets =
      [];


    state.sourceNumbers.forEach(
      function (sourceNumber) {

        /*
         * แต่ละ source คิดของใครของมัน
         *
         * เช่น
         *
         * 495 = 6 รายการ
         * 549 = 6 รายการ
         *
         * ถึงเลขกลับจะชนกัน
         * ก็ต้องคิดรวม 12 รายการ
         */

        bets =
          bets.concat(
            getPermutations3(
              sourceNumber
            )
          );

      }
    );


    /*
     * ใช้คิดเงินจริง
     *
     * ห้าม unique
     */

    state.betNumbers =
      bets;


    /*
     * ใช้แสดง
     *
     * ตัดซ้ำได้
     */

    state.currentNumbers =
      unique(
        bets
      );


    renderCurrentNumbers();

    updateLiveTotal();

  }


  /* =========================================================
     19 ประตู
  ========================================================= */

  function get19GateNumbers(
    digit
  ) {

    var result =
      [];


    for (
      var i = 0;
      i <= 9;
      i++
    ) {

      var other =
        String(i);


      result.push(
        digit +
        other
      );


      if (
        other !==
        digit
      ) {

        result.push(
          other +
          digit
        );

      }

    }


    return unique(
      result
    );

  }


  function rebuildGateNumbers() {

    var bets =
      [];


    state.sourceNumbers.forEach(
      function (digit) {

        bets =
          bets.concat(
            get19GateNumbers(
              digit
            )
          );

      }
    );


    state.betNumbers =
      bets;


    state.currentNumbers =
      unique(
        bets
      );


    renderCurrentNumbers();

    updateLiveTotal();

  }


  /* =========================================================
     REVERSE BUTTON
  ========================================================= */

  function reverseNumbers() {

    clearError();


    if (
      !state.sourceNumbers.length
    ) {

      showError(
        "กรุณากรอกเลขก่อน"
      );

      return;

    }


    /* =========================
       2 ตัว
    ========================= */

    if (
      state.mode === "two"
    ) {

      if (
        state.twoReverseActive
      ) {

        return;

      }


      state.twoReverseActive =
        true;


      rebuildTwoReverseNumbers();

      updateReverseButton();

      return;

    }


    /* =========================
       3 ตัว
    ========================= */

    if (
      state.mode === "three"
    ) {

      if (
        state.threeReverseActive
      ) {

        return;

      }


      state.threeReverseActive =
        true;


      rebuildThreeReverseNumbers();

      updateReverseButton();

      return;

    }

  }


  /* =========================================================
     DOUBLE
  ========================================================= */

  function addDoubles() {

    if (
      state.mode !==
      "two"
    ) {

      return;

    }


    for (
      var i = 0;
      i <= 9;
      i++
    ) {

      var number =
        String(i) +
        String(i);


      if (
        state.sourceNumbers.indexOf(
          number
        ) === -1
      ) {

        state.sourceNumbers.push(
          number
        );

      }

    }


    if (
      state.twoReverseActive
    ) {

      rebuildTwoReverseNumbers();

    } else {

      rebuildSimpleNumbers();

    }

  }


  /* =========================================================
     RENDER CURRENT
  ========================================================= */

  function renderCurrentNumbers() {

    els.chips.innerHTML =
      "";


    if (
      !state.currentNumbers.length
    ) {

      els.chips.classList.add(
        "empty"
      );


      var empty =
        document.createElement(
          "span"
        );


      empty.className =
        "empty-text";


      if (
        state.mode === "six"
      ) {

        empty.textContent =
          "กรอกเลข 3 ตัว ระบบจะทำ 6 กลับให้อัตโนมัติ";

      } else if (
        state.mode === "gate19"
      ) {

        empty.textContent =
          "กรอกเลขตั้งต้น 1 ตัว";

      } else {

        empty.textContent =
          "ยังไม่มีเลข";

      }


      els.chips.appendChild(
        empty
      );

    } else {

      els.chips.classList.remove(
        "empty"
      );


      var locked =
        (
          state.mode === "six" ||
          state.mode === "gate19" ||
          state.twoReverseActive ||
          state.threeReverseActive
        );


      state.currentNumbers.forEach(
        function (number) {

          var chip;


          if (locked) {

            chip =
              document.createElement(
                "span"
              );


            chip.className =
              "number-chip locked";

          } else {

            chip =
              document.createElement(
                "button"
              );


            chip.type =
              "button";


            chip.className =
              "number-chip";


            chip.addEventListener(
              "click",
              function () {

                removeSimpleNumber(
                  number
                );

              }
            );

          }


          chip.textContent =
            number;


          els.chips.appendChild(
            chip
          );

        }
      );

    }


    updateNumberCount();

  }


  function updateNumberCount() {

    var displayCount =
      state.currentNumbers.length;


    var betCount =
      state.betNumbers.length;


    if (
      betCount !==
      displayCount
    ) {

      els.numberCount.textContent =
        displayCount +
        " เลข • " +
        betCount +
        " รายการ";

    } else {

      els.numberCount.textContent =
        displayCount +
        " ตัว";

    }

  }


  function removeSimpleNumber(
    number
  ) {

    /*
     * ลบทีละเลขได้เฉพาะ
     * ก่อนกดกลับ
     */

    state.sourceNumbers =
      state.sourceNumbers.filter(
        function (item) {

          return (
            item !== number
          );

        }
      );


    rebuildSimpleNumbers();

  }


  function clearCurrent() {

    state.sourceNumbers =
      [];


    state.currentNumbers =
      [];


    state.betNumbers =
      [];


    state.twoReverseActive =
      false;


    state.threeReverseActive =
      false;


    if (
      els.numberInput
    ) {

      els.numberInput.value =
        "";

    }


    renderCurrentNumbers();

    updateReverseButton();

    updateLiveTotal();

    clearError();

  }


  /* =========================================================
     PRICE
  ========================================================= */

  function getPrice(
    value
  ) {

    return (
      Number(
        value || 0
      ) ||
      0
    );

  }


  function clearPrices() {

    els.priceA.value =
      "";


    els.priceB.value =
      "";


    updateLiveTotal();

  }


  function updateLiveTotal() {

    var mode =
      MODES[state.mode];


    var a =
      getPrice(
        els.priceA.value
      );


    var b =
      mode.priceB
        ? getPrice(
            els.priceB.value
          )
        : 0;


    /*
     * สำคัญมาก
     *
     * ใช้ betNumbers
     * ไม่ใช่ currentNumbers
     */

    var betCount =
      state.betNumbers.length;


    var total =
      betCount *
      (
        a +
        b
      );


    els.liveTotal.textContent =
      numberWithCommas(
        total
      ) +
      " บาท";


    els.addBill.disabled =
      (
        betCount === 0 ||
        (
          a <= 0 &&
          b <= 0
        )
      );

  }


  /* =========================================================
     ADD BILL
  ========================================================= */

  function addBill() {

    clearError();


    if (
      !els.lotto.value
    ) {

      showError(
        "กรุณาเลือกหวยก่อน"
      );

      return;

    }


    if (
      !state.betNumbers.length
    ) {

      showError(
        "กรุณากรอกเลขก่อน"
      );

      return;

    }


    var mode =
      MODES[state.mode];


    var priceA =
      getPrice(
        els.priceA.value
      );


    var priceB =
      mode.priceB
        ? getPrice(
            els.priceB.value
          )
        : 0;


    if (
      priceA <= 0 &&
      priceB <= 0
    ) {

      showError(
        "กรุณาใส่ราคา"
      );

      return;

    }


    var option =
      els.lotto.selectedOptions[0];


    var bill = {

      id:
        createId(),

      mode:
        state.mode,

      lottoName:
        els.lotto.value,

      closeTime:
        option
          ? (
              option.dataset.closeTime ||
              ""
            )
          : "",


      sourceNumbers:
        state.sourceNumbers.slice(),


      /*
       * สำหรับโชว์
       */

      numbers:
        state.currentNumbers.slice(),


      /*
       * สำหรับคำนวณจริง
       */

      betNumbers:
        state.betNumbers.slice(),


      betCount:
        state.betNumbers.length,


      reverseApplied:
        (
          state.twoReverseActive ||
          state.threeReverseActive
        ),


      priceA:
        priceA,

      priceB:
        priceB,


      subtotal:
        state.betNumbers.length *
        (
          priceA +
          priceB
        )

    };


    state.bills.push(
      bill
    );


    clearCurrent();

    clearPrices();

  function getBillMeta(
    bill
  ) {

    var mode =
      MODES[bill.mode];


    var prices =
      [];


    if (
      bill.priceA > 0
    ) {

      prices.push(
        mode.priceA +
        " " +
        bill.priceA
      );

    }


    if (
      mode.priceB &&
      bill.priceB > 0
    ) {

      prices.push(
        mode.priceB +
        " " +
        bill.priceB
      );

    }


    var countText;


    if (
      bill.betCount !==
      bill.numbers.length
    ) {

      countText =
        bill.numbers.length +
        " เลข • " +
        bill.betCount +
        " รายการ";

    } else {

      countText =
        bill.betCount +
        " ตัว";

    }


    if (
      bill.mode === "six"
    ) {

      return (
        bill.sourceNumbers.length +
        " ชุด • " +
        countText +
        " • " +
        prices.join(" / ")
      );

    }


    if (
      bill.mode === "gate19"
    ) {

      return (
        "เลขตั้งต้น " +
        bill.sourceNumbers.join(", ") +
        " • " +
        countText +
        " • " +
        prices.join(" / ")
      );

    }


    if (
      bill.reverseApplied
    ) {

      return (
        countText +
        " • กลับเลข • " +
        prices.join(" / ")
      );

    }


    return (
      countText +
      " • " +
      prices.join(" / ")
    );

  }

      payloads.map(
        function (item) {

          return apiCreateLiffOrder(

      )

    .then(

                extractLineMessages(

              );

        );

    .catch(

        );

        );

    );

  function buildCombinedOrderMessages(

    fallbackMessages
  ) {

    var local =
      buildCombinedOrderFlex(
        payloads
      );


    if (local) {

      return [
        local
      ];

    }


    return fallbackMessages;

  }


  function mergeDisplayGroups(
    payloads
  ) {

    var result =
      [];


    var map =
      {};


    payloads.forEach(
      function (item) {

        var key =
          [
            item.label,
            item.top,
            item.bottom,
            item.priceText
          ].join("|");


        var displayNumbers =
          item.displayNumbers &&
          item.displayNumbers.length

            ? item.displayNumbers.slice()

            : String(
                item.numbers ||
                ""
              )
              .split(/\s+/)
              .filter(Boolean);


        if (
          map[key] === undefined
        ) {

          map[key] =
            result.length;


          result.push({

            label:
              item.label,

            priceText:
              item.priceText,

            top:
              Number(
                item.top || 0
              ) || 0,

            bottom:
              Number(
                item.bottom || 0
              ) || 0,

            numbers:
              displayNumbers.slice(),

            betCount:
              Number(
                item.betCount || 0
              ) ||
              displayNumbers.length,

            subtotal:
              Number(
                item.subtotal || 0
              ) || 0

          });


          return;

        }


        var target =
          result[
            map[key]
          ];


        target.numbers =
          unique(
            target.numbers.concat(
              displayNumbers
            )
          );


        target.betCount +=
          Number(
            item.betCount || 0
          ) ||
          displayNumbers.length;


        target.subtotal +=
          Number(
            item.subtotal || 0
          ) ||
          0;

      }
    );


    return result;

  }

  /* =========================================================
     SEND LINE
  ========================================================= */

  function sendToLine(
    messages
  ) {

    var safeMessages =
      mergeFlexMessages(

        messages
          .map(
            normalizeLineMessage
          )
          .filter(Boolean)

      );


    if (
      !safeMessages.length
    ) {

      setLoading(
        false
      );


      throw new Error(
        "สร้าง Flex ไม่สำเร็จ"
      );

    }


    return ensureChatWritePermission()
      .then(
        function () {

          return liff.sendMessages(
            safeMessages
          );

        }
      )
      .then(
        function () {

          state.pendingPayloads =
            null;


          setLoading(
            false
          );


          if (
            liff.isInClient()
          ) {

            liff.closeWindow();

          }

        }
      );

  }


  function extractLineMessages(
    res
  ) {

    if (!res) {
      return [];
    }


    if (
      Array.isArray(
        res
      )
    ) {

      return res;

    }


    if (
      Array.isArray(
        res.messages
      )
    ) {

      return res.messages;

    }


    if (
      Array.isArray(
        res.flex
      )
    ) {

      return res.flex;

    }


    return [

      res.flex ||
      res.message ||
      res

    ];

  }


  function normalizeLineMessage(
    message
  ) {

    if (!message) {
      return null;
    }


    if (
      typeof message ===
      "string"
    ) {

      try {

        message =
          JSON.parse(
            message
          );

      } catch (err) {

        return null;

      }

    }


    if (
      message.type ===
      "flex"
    ) {

      if (
        !message.altText
      ) {

        message.altText =
          "โพยหวย";

      }


      return message;

    }


    if (
      message.contents
    ) {

      return {

        type:
          "flex",

        altText:
          message.altText ||
          "โพยหวย",

        contents:
          message.contents

      };

    }


    if (
      message.type ===
        "bubble" ||
      message.type ===
        "carousel" ||
      message.body ||
      message.hero
    ) {

      return {

        type:
          "flex",

        altText:
          "โพยหวย",

        contents:
          message

      };

    }


    return null;

  }


  function mergeFlexMessages(
    messages
  ) {

    var bubbles =
      [];


    messages.forEach(
      function (message) {

        if (
          !message ||
          message.type !==
            "flex" ||
          !message.contents
        ) {

          return;

        }


        if (
          message.contents.type ===
            "carousel" &&
          Array.isArray(
            message.contents.contents
          )
        ) {

          bubbles =
            bubbles.concat(
              message.contents.contents
            );

        } else {

          bubbles.push(
            message.contents
          );

        }

      }
    );


    if (
      !bubbles.length
    ) {

      return [];

    }


    if (
      bubbles.length ===
      1
    ) {

      return [{

        type:
          "flex",

        altText:
          "โพยหวย",

        contents:
          bubbles[0]

      }];

    }


    return [{

      type:
        "flex",

      altText:
        "โพยหวย",

      contents: {

        type:
          "carousel",

        contents:
          bubbles.slice(
            0,
            12
          )

      }

    }];

  }


  function ensureChatWritePermission() {

    if (
      !window.liff ||
      !liff.permission ||
      typeof liff.permission.query !==
        "function"
    ) {

      return Promise.resolve();

    }


    return liff.permission
      .query(
        "chat_message.write"
      )
      .then(
        function (
          permission
        ) {

          if (
            !permission ||
            permission.state ===
              "granted"
          ) {

            return;

          }


          if (
            typeof liff.permission.requestAll ===
              "function"
          ) {

            return liff.permission
              .requestAll();

          }


          throw new Error(
            "LIFF ยังไม่ได้เปิดสิทธิ์ chat_message.write"
          );

        }
      );

  }


  /* =========================================================
     UI HELPERS
  ========================================================= */

  function setLoading(
    on
  ) {

    els.loading.classList.toggle(
      "show",
      !!on
    );

  }


  function showToast(
    message
  ) {

    els.toast.textContent =
      message;


    els.toast.classList.add(
      "show"
    );


    clearTimeout(
      toastTimer
    );


    toastTimer =
      setTimeout(
        function () {

          els.toast.classList.remove(
            "show"
          );

        },
        1200
      );

  }


  function showError(
    err
  ) {

    setLoading(
      false
    );


    els.error.textContent =
      formatError(
        err
      );

  }


  function clearError() {

    els.error.textContent =
      "";

  }


  function formatError(
    err
  ) {

    if (!err) {

      return "เกิดข้อผิดพลาด";

    }


    if (
      typeof err ===
      "string"
    ) {

      return err;

    }


    if (
      err.message
    ) {

      return err.message;

    }


    try {

      return JSON.stringify(
        err
      );

    } catch (jsonErr) {

      return String(
        err
      );

    }

  }


  /* =========================================================
     BASIC HELPERS
  ========================================================= */

  function unique(
    list
  ) {

    var seen =
      {};


    return list.filter(
      function (item) {

        if (
          seen[item]
        ) {

          return false;

        }


        seen[item] =
          true;


        return true;

      }
    );

  }


  function createId() {

    return (
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2)
    );

  }


  function numberWithCommas(
    value
  ) {

    return Number(
      value || 0
    )
    .toLocaleString(
      "en-US"
    );

  }


  function pad2(
    value
  ) {

    return String(
      value
    )
    .padStart(
      2,
      "0"
    );

  }
