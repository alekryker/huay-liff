
<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#C9152D">

  <title>วางโพยหวย</title>

  <style>
    :root {
      --red: #e11d35;
      --red-main: #c9152d;
      --red-dark: #991b2e;
      --red-deep: #6f1220;

      --red-soft: #fff1f3;
      --red-soft-2: #fff7f8;

      --bg: #f5f5f7;
      --card: #ffffff;

      --ink: #18181b;
      --muted: #71717a;

      --line: #e4e4e7;
      --line-red: #fecdd3;

      --green: #22c55e;

      --radius: 18px;
      --radius-lg: 24px;

      --shadow:
        0 8px 28px rgba(24, 24, 27, .06);

      --shadow-red:
        0 10px 28px rgba(201, 21, 45, .18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(
          circle at top,
          rgba(225, 29, 53, .07),
          transparent 320px
        ),
        var(--bg);

      color: var(--ink);

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans Thai",
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;

      transition:
        transform .12s ease,
        background-color .15s ease,
        border-color .15s ease;
    }

    button:active {
      transform: scale(.97);
    }

    input,
    textarea {
      outline: none;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .app {
      width: 100%;
      max-width: 680px;

      min-height: 100vh;

      margin: 0 auto;

      padding:
        12px
        12px
        calc(120px + env(safe-area-inset-bottom));
    }


    /* =============================
       LOTTO HEADER
    ============================= */

    .lotto-card {
      position: relative;

      overflow: hidden;

      padding: 18px;

      border: 1px solid var(--line);
      border-radius: var(--radius-lg);

      background: #fff;

      box-shadow: var(--shadow);
    }

    .lotto-card::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;

      width: 54px;
      height: 5px;

      border-radius: 0 0 5px 0;

      background:
        linear-gradient(
          90deg,
          var(--red-main),
          #ff334f
        );
    }

    .lotto-title {
      padding-right: 10px;

      color: #111;

      font-size: 25px;
      font-weight: 900;

      line-height: 1.3;
    }

    .lotto-info {
      margin-top: 18px;

      display: grid;
      gap: 15px;
    }

    .info-row {
      display: grid;

      grid-template-columns:
        100px
        minmax(0, 1fr);

      align-items: center;

      gap: 10px;
    }

    .info-label {
      color: var(--muted);

      font-size: 16px;
      font-weight: 600;
    }

    .info-value {
      text-align: right;

      color: #27272a;

      font-size: 17px;
      font-weight: 700;

      font-variant-numeric: tabular-nums;
    }

    .countdown {
      margin-top: 12px;

      text-align: right;

      color: var(--green);

      font-size: 22px;
      font-weight: 800;

      font-variant-numeric: tabular-nums;
    }


    /* =============================
       MODE TABS
    ============================= */

    .mode-sticky {
      position: sticky;

      top: calc(8px + env(safe-area-inset-top));

      z-index: 30;

      margin-top: 14px;
    }

    .mode-tabs {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      overflow: hidden;

      padding: 4px;

      border: 1px solid rgba(228, 228, 231, .9);
      border-radius: 18px;

      background: rgba(255, 255, 255, .95);

      box-shadow:
        0 6px 20px rgba(0, 0, 0, .07);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .mode-btn {
      min-width: 0;
      min-height: 52px;

      padding: 5px 3px;

      border: 0;
      border-radius: 14px;

      background: transparent;

      color: #3f3f46;

      font-size: 15px;
      font-weight: 800;

      white-space: nowrap;
    }

    .mode-btn.active {
      background:
        linear-gradient(
          145deg,
          #b31329,
          #e11d35
        );

      color: #fff;

      box-shadow:
        0 5px 14px rgba(201, 21, 45, .21);
    }


    /* =============================
       MAIN PANEL
    ============================= */

    .main-panel {
      margin-top: 14px;

      padding: 15px;

      border: 1px solid var(--line);
      border-radius: var(--radius-lg);

      background: #fff;

      box-shadow: var(--shadow);
    }

    .section-head {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;
    }

    .section-title {
      color: #18181b;

      font-size: 18px;
      font-weight: 900;
    }

    .number-count {
      padding: 6px 10px;

      border-radius: 999px;

      background: var(--red-soft);

      color: var(--red-main);

      font-size: 12px;
      font-weight: 900;
    }


    /* =============================
       PASTE
    ============================= */

    .paste-section {
      margin-top: 13px;
    }

    .paste-section.hidden {
      display: none;
    }

    .paste-box {
      width: 100%;
      height: 85px;

      resize: none;

      padding: 13px 14px;

      border: 1.5px solid #e4e4e7;
      border-radius: 15px;

      background: #fafafa;

      color: #18181b;

      font-size: 16px;
      font-weight: 650;

      line-height: 1.45;
    }

    .paste-box:focus {
      border-color: #fda4af;

      background: #fff;

      box-shadow:
        0 0 0 3px rgba(225, 29, 53, .08);
    }

    .paste-box::placeholder {
      color: #a1a1aa;
    }

    .paste-action {
      width: 100%;
      min-height: 48px;

      margin-top: 8px;

      border: 0;
      border-radius: 14px;

      background: var(--red-soft);

      color: var(--red-main);

      font-size: 15px;
      font-weight: 900;
    }


    /* =============================
       MANUAL NUMBER INPUT
    ============================= */

    .manual-title {
      margin-top: 17px;

      color: var(--muted);

      font-size: 12px;
      font-weight: 800;
    }

    .number-input-wrap {
      position: relative;

      margin-top: 7px;
    }

    .number-input {
      width: 100%;
      height: 62px;

      padding: 0 54px 0 16px;

      border: 1.5px solid #d4d4d8;
      border-radius: 16px;

      background: #fff;

      color: #18181b;

      font-size: 25px;
      font-weight: 900;

      letter-spacing: .06em;

      font-variant-numeric: tabular-nums;
    }

    .number-input:focus {
      border-color: var(--red);

      box-shadow:
        0 0 0 3px rgba(225, 29, 53, .08);
    }

    .number-input::placeholder {
      color: #c4c4c8;

      font-size: 17px;
      font-weight: 600;

      letter-spacing: 0;
    }

    .input-length {
      position: absolute;

      top: 50%;
      right: 14px;

      transform: translateY(-50%);

      min-width: 32px;

      padding: 5px 7px;

      border-radius: 8px;

      background: #f4f4f5;

      color: #71717a;

      text-align: center;

      font-size: 11px;
      font-weight: 900;
    }


    /* =============================
       NUMBER PREVIEW
    ============================= */

    .preview {
      margin-top: 16px;
    }

    .preview-head {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 8px;
    }

    .preview-title {
      color: #52525b;

      font-size: 13px;
      font-weight: 800;
    }

    .clear-preview {
      border: 0;

      padding: 5px 8px;

      background: transparent;

      color: #e11d48;

      font-size: 12px;
      font-weight: 800;
    }

    .chips {
      min-height: 61px;

      margin-top: 8px;

      display: flex;
      flex-wrap: wrap;

      align-items: flex-start;

      gap: 7px;
    }

    .chips.empty {
      display: flex;

      align-items: center;
      justify-content: center;

      border: 1.5px dashed #e4e4e7;
      border-radius: 15px;

      background: #fafafa;
    }

    .empty-text {
      color: #a1a1aa;

      font-size: 13px;
      font-weight: 700;
    }

    .number-chip {
      position: relative;

      min-width: 54px;
      height: 45px;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      padding: 0 10px;

      border: 0;
      border-radius: 12px;

      background:
        linear-gradient(
          145deg,
          #d91834,
          #ff304a
        );

      color: #fff;

      font-size: 18px;
      font-weight: 850;

      font-variant-numeric: tabular-nums;

      box-shadow:
        0 4px 11px rgba(225, 29, 53, .19);
    }

    .number-chip:active {
      opacity: .75;
    }


    /* =============================
       NUMBER TOOLS
    ============================= */

    .number-tools {
      display: flex;
      flex-wrap: wrap;

      gap: 8px;

      margin-top: 12px;
    }

    .tool-btn {
      min-height: 44px;

      padding: 0 16px;

      border: 1px solid #d4d4d8;
      border-radius: 13px;

      background: #fff;

      color: #27272a;

      font-size: 14px;
      font-weight: 850;
    }

    .tool-btn.primary {
      border-color: #fecdd3;

      background: var(--red-soft);

      color: var(--red-main);
    }

    .tool-btn.hidden {
      display: none;
    }


    /* =============================
       PRICE
    ============================= */

    .price-area {
      margin-top: 18px;

      padding-top: 16px;

      border-top: 1px solid #f1f1f1;
    }

    .price-title {
      margin-bottom: 8px;

      color: #52525b;

      font-size: 13px;
      font-weight: 800;
    }

    .price-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 8px;
    }

    .price-grid.one {
      grid-template-columns: 1fr;
    }

    .price-field {
      position: relative;
    }

    .price-field.hidden {
      display: none;
    }

    .price-input {
      width: 100%;
      height: 58px;

      padding: 20px 12px 5px;

      border: 1.5px solid #d4d4d8;
      border-radius: 15px;

      background: #fff;

      color: #18181b;

      font-size: 19px;
      font-weight: 900;

      text-align: center;

      font-variant-numeric: tabular-nums;
    }

    .price-input:focus {
      border-color: var(--red);

      box-shadow:
        0 0 0 3px rgba(225, 29, 53, .08);
    }

    .price-label {
      position: absolute;

      top: 6px;
      left: 0;
      right: 0;

      pointer-events: none;

      color: #a1a1aa;

      text-align: center;

      font-size: 10px;
      font-weight: 800;
    }


    /* =============================
       LIVE TOTAL
    ============================= */

    .live-total {
      margin-top: 10px;

      padding: 11px 13px;

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      border-radius: 14px;

      background: #fafafa;
    }

    .live-total-label {
      color: #71717a;

      font-size: 12px;
      font-weight: 800;
    }

    .live-total-value {
      color: var(--red-main);

      font-size: 19px;
      font-weight: 950;

      font-variant-numeric: tabular-nums;
    }


    /* =============================
       ADD BILL
    ============================= */

    .add-bill {
      width: 100%;
      min-height: 58px;

      margin-top: 11px;

      border: 0;
      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          #bd122a,
          #ed1d3b
        );

      color: #fff;

      font-size: 18px;
      font-weight: 900;

      box-shadow: var(--shadow-red);
    }

    .add-bill:disabled {
      background: #d4d4d8;

      box-shadow: none;
    }


    /* =============================
       ERROR
    ============================= */

    .error {
      min-height: 18px;

      margin-top: 8px;

      color: #dc2626;

      text-align: center;

      font-size: 12px;
      font-weight: 800;
    }


    /* =============================
       BILL LIST
    ============================= */

    .bill-section {
      margin-top: 14px;
    }

    .bill-section-title {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      padding: 0 3px 8px;
    }

    .bill-title {
      font-size: 17px;
      font-weight: 900;
    }

    .bill-count {
      color: var(--muted);

      font-size: 12px;
      font-weight: 800;
    }

    .bill-list {
      display: grid;
      gap: 9px;
    }

    .bill-empty {
      padding: 24px;

      border: 1px dashed #d4d4d8;
      border-radius: 18px;

      background: rgba(255, 255, 255, .65);

      color: #a1a1aa;

      text-align: center;

      font-size: 13px;
      font-weight: 700;
    }

    .bill-card {
      overflow: hidden;

      border: 1px solid var(--line);
      border-radius: 18px;

      background: #fff;

      box-shadow:
        0 4px 16px rgba(0, 0, 0, .035);
    }

    .bill-head {
      padding: 11px 13px;

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      border-bottom: 1px solid #fee2e2;

      background:
        linear-gradient(
          90deg,
          #fff1f3,
          #fff
        );
    }

    .bill-mode {
      color: var(--red-main);

      font-size: 15px;
      font-weight: 900;
    }

    .bill-subtotal {
      color: #18181b;

      font-size: 16px;
      font-weight: 950;
    }

    .bill-body {
      padding: 11px 13px;
    }

    .bill-meta {
      margin-bottom: 6px;

      color: #71717a;

      font-size: 11px;
      font-weight: 750;
    }

    .bill-numbers {
      color: #3f3f46;

      font-size: 16px;
      font-weight: 850;

      line-height: 1.55;

      word-break: break-word;

      font-variant-numeric: tabular-nums;
    }

    .bill-foot {
      padding:
        0
        13px
        11px;

      display: flex;

      justify-content: flex-end;
    }

    .delete-bill {
      min-height: 36px;

      padding: 0 12px;

      border: 0;
      border-radius: 10px;

      background: var(--red-soft);

      color: #e11d48;

      font-size: 12px;
      font-weight: 850;
    }


    /* =============================
       STICKY BOTTOM TOTAL
    ============================= */

    .bottom-bar {
      position: fixed;

      left: 50%;
      bottom: calc(7px + env(safe-area-inset-bottom));

      transform: translateX(-50%);

      z-index: 50;

      width: min(calc(100% - 16px), 664px);

      padding: 10px;

      border: 1px solid rgba(228, 228, 231, .85);
      border-radius: 20px;

      background: rgba(255, 255, 255, .95);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 12px 38px rgba(0, 0, 0, .16);
    }

    .bottom-total {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      padding: 9px 12px;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          #761323,
          #c9152d
        );

      color: #fff;
    }

    .bottom-label {
      color: rgba(255, 255, 255, .75);

      font-size: 11px;
      font-weight: 800;
    }

    .bottom-value {
      font-size: 22px;
      font-weight: 950;

      font-variant-numeric: tabular-nums;
    }

    .bottom-actions {
      margin-top: 7px;

      display: grid;

      grid-template-columns:
        .65fr
        1.35fr;

      gap: 7px;
    }

    .clear-bills,
    .submit-bills {
      min-height: 45px;

      border-radius: 13px;

      font-size: 14px;
      font-weight: 900;
    }

    .clear-bills {
      border: 1px solid #fecdd3;

      background: #fff;

      color: #e11d48;
    }

    .submit-bills {
      border: 0;

      background: var(--red);

      color: #fff;
    }


    /* =============================
       PAYLOAD DEBUG
    ============================= */

    .payload-box {
      display: none;

      margin-top: 14px;

      padding: 12px;

      overflow: auto;

      border-radius: 15px;

      background: #18181b;

      color: #f4f4f5;

      font-family: monospace;

      font-size: 11px;

      line-height: 1.5;

      white-space: pre-wrap;
    }


    /* =============================
       RESPONSIVE
    ============================= */

    @media (max-width: 430px) {

      .app {
        padding-left: 10px;
        padding-right: 10px;
      }

      .lotto-card {
        padding: 16px;
      }

      .lotto-title {
        font-size: 22px;
      }

      .info-row {
        grid-template-columns:
          90px
          minmax(0, 1fr);
      }

      .mode-btn {
        min-height: 49px;

        font-size: 13px;
      }

      .main-panel {
        padding: 13px;
      }

      .number-chip {
        min-width: 50px;

        height: 42px;

        font-size: 17px;
      }
    }
  </style>
</head>

<body>

<main class="app">

  <!-- =========================
       LOTTO INFO
  ========================== -->

  <section class="lotto-card">

    <div
      class="lotto-title"
      id="lottoTitle"
    >
      [หวยรายวัน] ลาวสามัคคี
    </div>

    <div class="lotto-info">

      <div class="info-row">
        <div class="info-label">
          งวดที่
        </div>

        <div
          class="info-value"
          id="lottoDate"
        >
          08-08-2026
        </div>
      </div>

      <div class="info-row">
        <div class="info-label">
          เวลาปิดรับ
        </div>

        <div
          class="info-value"
          id="closeDateTime"
        >
          08-08-2026 20:25
        </div>
      </div>

    </div>

    <div
      class="countdown"
      id="countdown"
    >
      --:--:--
    </div>

  </section>


  <!-- =========================
       MODE
  ========================== -->

  <section class="mode-sticky">

    <div class="mode-tabs">

      <button
        type="button"
        class="mode-btn active"
        data-mode="two"
      >
        2 ตัว
      </button>

      <button
        type="button"
        class="mode-btn"
        data-mode="three"
      >
        3 ตัว
      </button>

      <button
        type="button"
        class="mode-btn"
        data-mode="six"
      >
        6 กลับ
      </button>

      <button
        type="button"
        class="mode-btn"
        data-mode="gate19"
      >
        19 ประตู
      </button>

    </div>

  </section>


  <!-- =========================
       INPUT PANEL
  ========================== -->

  <section class="main-panel">

    <div class="section-head">

      <div class="section-title">
        เพิ่มเลข
      </div>

      <div
        class="number-count"
        id="numberCount"
      >
        0 ตัว
      </div>

    </div>


    <!-- PASTE -->

    <div
      class="paste-section"
      id="pasteSection"
    >

      <textarea
        class="paste-box"
        id="pasteInput"
        placeholder="วางโพย เช่น 82/89/80/83/84/90/92/93"
      ></textarea>

      <button
        class="paste-action"
        id="parsePaste"
        type="button"
      >
        อ่านโพย
      </button>

    </div>


    <!-- MANUAL INPUT -->

    <div
      class="manual-title"
      id="manualTitle"
    >
      หรือกรอกเลขทีละตัว
    </div>

    <div class="number-input-wrap">

      <input
        class="number-input"
        id="numberInput"
        type="tel"
        inputmode="numeric"
        autocomplete="off"
        placeholder="กรอกเลข 2 ตัว"
      >

      <span
        class="input-length"
        id="inputLength"
      >
        0/2
      </span>

    </div>


    <!-- PREVIEW -->

    <div class="preview">

      <div class="preview-head">

        <div class="preview-title">
          เลขที่กำลังแทง
        </div>

        <button
          class="clear-preview"
          id="clearPreview"
          type="button"
        >
          ล้างเลข
        </button>

      </div>

      <div
        class="chips empty"
        id="chips"
      >
        <span class="empty-text">
          ยังไม่มีเลข
        </span>
      </div>

    </div>


    <!-- TOOLS -->

    <div class="number-tools">

      <button
        class="tool-btn primary"
        id="reverseBtn"
        type="button"
      >
        ↔ กลับเลข
      </button>

      <button
        class="tool-btn"
        id="doubleBtn"
        type="button"
      >
        + เลขเบิ้ล
      </button>

    </div>


    <!-- PRICE -->

    <div class="price-area">

      <div
        class="price-title"
        id="priceTitle"
      >
        ใส่ราคา
      </div>

      <div
        class="price-grid"
        id="priceGrid"
      >

        <div class="price-field">

          <label
            class="price-label"
            id="priceLabelA"
          >
            บน
          </label>

          <input
            class="price-input"
            id="priceA"
            type="number"
            min="0"
            step="1"
            inputmode="numeric"

<script>

  /* ============================
     CONFIG
  ============================ */

  const CONFIG = {

    lottoName:
      "[หวยรายวัน] ลาวสามัคคี",

    lottoDate:
      "08-08-2026",

    closeAt:
      "2026-08-08T20:25:00"

  };


  /* ============================
     MODES
  ============================ */

  const MODES = {

    two: {

      label:
        "2 ตัว",

      len:
        2,

      paste:
        true,

      reverse:
        true,

      double:
        true,

      priceA:
        "บน",

      priceB:
        "ล่าง"

    },


    three: {

      label:
        "3 ตัว",

      len:
        3,

      paste:
        true,

      reverse:
        true,

      double:
        false,

      priceA:
        "ตรง",

      priceB:
        "โต๊ด"

    },


    six: {

      label:
        "6 กลับ",

      len:
        3,

      paste:
        true,

      reverse:
        false,

      double:
        false,

      priceA:
        "บนตรง",

      priceB:
        null

    },


    gate19: {

      label:
        "19 ประตู",

      len:
        1,

      paste:
        false,

      reverse:
        false,

      double:
        false,

      priceA:
        "บน",

      priceB:
        "ล่าง"

    }

  };


  /* ============================
     STATE
  ============================ */

  const state = {

    mode:
      "two",

    currentNumbers:
      [],

    sourceNumbers:
      [],

    bills:
      []

  };


  /* ============================
     ELEMENTS
  ============================ */

  const els = {

    lottoTitle:
      document.getElementById("lottoTitle"),

    lottoDate:
      document.getElementById("lottoDate"),

    closeDateTime:
      document.getElementById("closeDateTime"),

    countdown:
      document.getElementById("countdown"),


    modeButtons:
      [...document.querySelectorAll("[data-mode]")],


    pasteSection:
      document.getElementById("pasteSection"),

    pasteInput:
      document.getElementById("pasteInput"),

    parsePaste:
      document.getElementById("parsePaste"),


    manualTitle:
      document.getElementById("manualTitle"),

    numberInput:
      document.getElementById("numberInput"),

    inputLength:
      document.getElementById("inputLength"),


    chips:
      document.getElementById("chips"),

    numberCount:
      document.getElementById("numberCount"),

    clearPreview:
      document.getElementById("clearPreview"),


    reverseBtn:
      document.getElementById("reverseBtn"),

    doubleBtn:
      document.getElementById("doubleBtn"),


    priceGrid:
      document.getElementById("priceGrid"),

    priceFieldB:
      document.getElementById("priceFieldB"),

    priceLabelA:
      document.getElementById("priceLabelA"),

    priceLabelB:
      document.getElementById("priceLabelB"),

    priceA:
      document.getElementById("priceA"),

    priceB:
      document.getElementById("priceB"),

    liveTotal:
      document.getElementById("liveTotal"),


    addBill:
      document.getElementById("addBill"),

    error:
      document.getElementById("error"),


    billList:
      document.getElementById("billList"),

    billCount:
      document.getElementById("billCount"),

    grandTotal:
      document.getElementById("grandTotal"),


    clearBills:
      document.getElementById("clearBills"),

    submitBills:
      document.getElementById("submitBills"),

    payloadBox:
      document.getElementById("payloadBox")

  };


  /* ============================
     INIT
  ============================ */

  document.addEventListener(
    "DOMContentLoaded",
    init
  );


  function init() {

    renderConfig();

    bindEvents();

    updateMode();

    renderCurrentNumbers();

    renderBills();

    updateLiveTotal();

    updateCountdown();

    setInterval(
      updateCountdown,
      1000
    );

  }


  /* ============================
     CONFIG DISPLAY
  ============================ */

  function renderConfig() {

    els.lottoTitle.textContent =
      CONFIG.lottoName;

    els.lottoDate.textContent =
      CONFIG.lottoDate;

    const close =
      new Date(CONFIG.closeAt);

    els.closeDateTime.textContent =
      formatDateTime(close);

  }


  /* ============================
     EVENTS
  ============================ */

  function bindEvents() {

    els.modeButtons.forEach(
      function(button) {

        button.addEventListener(
          "click",
          function() {

            setMode(
              button.dataset.mode
            );

          }
        );

      }
    );


    els.parsePaste.addEventListener(
      "click",
      parsePaste
    );


    els.numberInput.addEventListener(
      "input",
      handleNumberInput
    );


    els.numberInput.addEventListener(
      "paste",
      function() {

        setTimeout(
          handleNumberInput,
          0
        );

      }
    );


    els.reverseBtn.addEventListener(
      "click",
      reverseNumbers
    );


    els.doubleBtn.addEventListener(
      "click",
      addDoubles
    );


    els.clearPreview.addEventListener(
      "click",
      clearCurrent
    );


    els.priceA.addEventListener(
      "input",
      updateLiveTotal
    );


    els.priceB.addEventListener(
      "input",
      updateLiveTotal
    );


    els.addBill.addEventListener(
      "click",
      addBill
    );


    els.clearBills.addEventListener(
      "click",
      clearBills
    );


    els.submitBills.addEventListener(
      "click",
      submitBills
    );

  }


  /* ============================
     MODE
  ============================ */

  function setMode(mode) {

    if (!MODES[mode]) {
      return;
    }

    state.mode =
      mode;

    clearCurrent();

    clearPrices();

    els.pasteInput.value =
      "";

    updateMode();

  }


  function updateMode() {

    const meta =
      MODES[state.mode];


    els.modeButtons.forEach(
      function(button) {

        button.classList.toggle(
          "active",
          button.dataset.mode === state.mode
        );

      }
    );


    els.pasteSection.classList.toggle(
      "hidden",
      !meta.paste
    );


    els.reverseBtn.classList.toggle(
      "hidden",
      !meta.reverse
    );


    els.doubleBtn.classList.toggle(
      "hidden",
      !meta.double
    );


    els.numberInput.maxLength =
      meta.len;


    els.numberInput.placeholder =
      state.mode === "gate19"
        ? "กรอกเลขตั้งต้น 1 ตัว"
        : "กรอกเลข " + meta.len + " ตัว";


    els.inputLength.textContent =
      "0/" + meta.len;


    if (state.mode === "two") {

      els.pasteInput.placeholder =
        "วางโพย เช่น 82/89/80/83/84/90/92";

    }


    if (state.mode === "three") {

      els.pasteInput.placeholder =
        "วางโพย เช่น 123/456/789";

    }


    if (state.mode === "six") {

      els.pasteInput.placeholder =
        "วางเลขตั้งต้น เช่น 123/456/789";

    }


    els.priceLabelA.textContent =
      meta.priceA;


    if (meta.priceB) {

      els.priceFieldB.classList.remove(
        "hidden"
      );

      els.priceGrid.classList.remove(
        "one"
      );

      els.priceLabelB.textContent =
        meta.priceB;

    } else {

      els.priceFieldB.classList.add(
        "hidden"
      );

      els.priceGrid.classList.add(
        "one"
      );

    }


    updateLiveTotal();

  }


  /* ============================
     MANUAL INPUT
  ============================ */

  function handleNumberInput() {

    const meta =
      MODES[state.mode];


    let value =
      String(
        els.numberInput.value || ""
      )
      .replace(/\D/g, "")
      .slice(
        0,
        meta.len
      );


    els.numberInput.value =
      value;


    els.inputLength.textContent =
      value.length +
      "/" +
      meta.len;


    if (
      value.length !==
      meta.len
    ) {

      return;

    }


    addSourceNumber(
      value
    );


    els.numberInput.value =
      "";


    els.inputLength.textContent =
      "0/" +
      meta.len;

  }


  /* ============================
     ADD BASE NUMBER
  ============================ */

  function addSourceNumber(number) {

    if (
      state.sourceNumbers.indexOf(number) === -1
    ) {

      state.sourceNumbers.push(
        number
      );

    }


    if (
      state.mode === "six"
    ) {

      const expanded =
        getPermutations3(
          number
        );


      state.currentNumbers =
        unique(
          state.currentNumbers.concat(
            expanded
          )
        );

    }


    else if (
      state.mode === "gate19"
    ) {

      const expanded =
        get19GateNumbers(
          number
        );


      state.currentNumbers =
        unique(
          state.currentNumbers.concat(
            expanded
          )
        );

    }


    else {

      state.currentNumbers =
        unique(
          state.currentNumbers.concat(
            number
          )
        );

    }


    renderCurrentNumbers();

    updateLiveTotal();

  }


  /* ============================
     PASTE
  ============================ */

  function parsePaste() {

    clearError();


    const meta =
      MODES[state.mode];


    if (!meta.paste) {

      return;

    }


    const raw =
      String(
        els.pasteInput.value || ""
      ).trim();


    if (!raw) {

      showError(
        "กรุณาวางโพยก่อน"
      );

      return;

    }


    const numbers =
      extractNumbers(
        raw,
        meta.len
      );


    if (!numbers.length) {

      showError(
        "ไม่พบเลขที่ถูกต้อง"
      );

      return;

    }


    numbers.forEach(
      function(number) {

        addSourceNumber(
          number
        );

      }
    );


    /*
     * ตามที่ขอ:
     * วางโพยเสร็จแล้วข้อความหายทันที
     */

    els.pasteInput.value =
      "";

  }


  function extractNumbers(
    raw,
    len
  ) {

    const text =
      String(raw || "")
      .replace(
        /[,\n\r\t|;]+/g,
        "/"
      )
      .replace(
        /\s+/g,
        "/"
      )
      .replace(
        /\/+/g,
        "/"
      );


    return unique(

      text
      .split("/")
      .map(
        function(item) {

          return item
            .replace(
              /\D/g,
              ""
            );

        }
      )
      .filter(
        function(item) {

          return (
            item.length ===
            len
          );

        }
      )

    );

  }


  /* ============================
     REVERSE
  ============================ */

  function reverseNumbers() {

    clearError();


    if (
      !state.currentNumbers.length
    ) {

      showError(
        "กรุณาเพิ่มเลขก่อน"
      );

      return;

    }


    if (
      state.mode === "two"
    ) {

      const reversed =
        state.currentNumbers.map(
          function(number) {

            return (
              number[1] +
              number[0]
            );

          }
        );


      state.currentNumbers =
        unique(
          state.currentNumbers.concat(
            reversed
          )
        );

    }


    if (
      state.mode === "three"
    ) {

      let result =
        state.currentNumbers.slice();


      state.sourceNumbers.forEach(
        function(number) {

          result =
            result.concat(
              getPermutations3(
                number
              )
            );

        }
      );


      state.currentNumbers =
        unique(
          result
        );

    }


    renderCurrentNumbers();

    updateLiveTotal();

  }


  /* ============================
     2-DIGIT DOUBLES
  ============================ */

  function addDoubles() {

    if (
      state.mode !== "two"
    ) {

      return;

    }


    const doubles =
      [];


    for (
      let i = 0;
      i <= 9;
      i++
    ) {

      doubles.push(
        String(i) +
        String(i)
      );

    }


    state.sourceNumbers =
      unique(
        state.sourceNumbers.concat(
          doubles
        )
      );


    state.currentNumbers =
      unique(
        state.currentNumbers.concat(
          doubles
        )
      );


    renderCurrentNumbers();

    updateLiveTotal();

  }


  /* ============================
     THREE DIGIT PERMUTATIONS
  ============================ */

  function getPermutations3(number) {

    const chars =
      String(number)
      .split("");


    const output =
      [];


    for (
      let a = 0;
      a < chars.length;
      a++
    ) {

      for (
        let b = 0;
        b < chars.length;
        b++
      ) {

        for (
          let c = 0;
          c < chars.length;
          c++
        ) {

          if (
            a === b ||
            a === c ||
            b === c
          ) {

            continue;

          }


          output.push(
            chars[a] +
            chars[b] +
            chars[c]
          );

        }

      }

    }


    return unique(
      output
    );

  }


  /* ============================
     19 GATE
  ============================ */

  function get19GateNumbers(digit) {

    const result =
      [];


    for (
      let i = 0;
      i <= 9;
      i++
    ) {

      const other =
        String(i);


      result.push(
        digit +
        other
      );


      if (
        other !==
        digit
      ) {

        result.push(
          other +
          digit
        );

      }

    }


    return unique(
      result
    );

  }


  /* ============================
     CURRENT NUMBER PREVIEW
  ============================ */

  function renderCurrentNumbers() {

    els.chips.innerHTML =
      "";


    if (
      !state.currentNumbers.length
    ) {

      els.chips.classList.add(
        "empty"
      );


      const empty =
        document.createElement(
          "span"
        );


      empty.className =
        "empty-text";


      empty.textContent =
        state.mode === "gate19"
          ? "กรอกเลขตั้งต้นเพื่อสร้าง 19 ประตู"
          : "ยังไม่มีเลข";


      els.chips.appendChild(
        empty
      );

    } else {

      els.chips.classList.remove(
        "empty"
      );


      state.currentNumbers.forEach(
        function(number) {

          const chip =
            document.createElement(
              "button"
            );


          chip.type =
            "button";


          chip.className =
            "number-chip";


          chip.textContent =
            number;


          chip.title =
            "กดเพื่อลบ " +
            number;


          chip.addEventListener(
            "click",
            function() {

              removeCurrentNumber(
                number
              );

            }
          );


          els.chips.appendChild(
            chip
          );

        }
      );

    }


    els.numberCount.textContent =
      state.currentNumbers.length +
      " ตัว";

  }


  function removeCurrentNumber(
    number
  ) {

    state.currentNumbers =
      state.currentNumbers.filter(
        function(item) {

          return (
            item !==
            number
          );

        }
      );


    /*
     * ถ้าลบเลขต้นฉบับออก
     * ก็เอาออกจาก source ด้วย
     */

    state.sourceNumbers =
      state.sourceNumbers.filter(
        function(item) {

          return (
            item !==
            number
          );

        }
      );


    renderCurrentNumbers();

    updateLiveTotal();

  }


  function clearCurrent() {

    state.currentNumbers =
      [];


    state.sourceNumbers =
      [];


    els.numberInput.value =
      "";


    const len =
      MODES[state.mode].len;


    els.inputLength.textContent =
      "0/" +
      len;


    renderCurrentNumbers();

    updateLiveTotal();

    clearError();

  }


  /* ============================
     LIVE PRICE
  ============================ */

  function updateLiveTotal() {

    const meta =
      MODES[state.mode];


    const a =
      getPrice(
        els.priceA.value
      );


    const b =
      meta.priceB
        ? getPrice(
            els.priceB.value
          )
        : 0;


    const count =
      state.currentNumbers.length;


    const total =
      count *
      (a + b);


    els.liveTotal.textContent =
      numberWithCommas(
        total
      ) +
      " บาท";


    els.addBill.disabled =
      (
        count === 0 ||
        (
          a <= 0 &&
          b <= 0
        )
      );

  }


  /* ============================
     ADD BILL
  ============================ */

  function addBill() {

    clearError();


    if (
      !state.currentNumbers.length
    ) {

      showError(
        "กรุณาเพิ่มเลขก่อน"
      );

      return;

    }


    const meta =
      MODES[state.mode];


    const a =
      getPrice(
        els.priceA.value
      );


    const b =
      meta.priceB
        ? getPrice(
            els.priceB.value
          )
        : 0;


    if (
      a <= 0 &&
      b <= 0
    ) {

      showError(
        "กรุณาใส่ราคา"
      );

      return;

    }


    const numbers =
      state.currentNumbers.slice();


    const subtotal =
      numbers.length *
      (a + b);


    const bill = {

      id:
        createId(),

      mode:
        state.mode,

      numbers:
        numbers,

      sourceNumbers:
        state.sourceNumbers.slice(),

      priceA:
        a,

      priceB:
        b,

      subtotal:
        subtotal

    };


    state.bills.push(
      bill
    );


    clearCurrent();

    clearPrices();

    renderBills();

  }


  /* ============================
     BILL RENDER
  ============================ */

  function renderBills() {

    els.billList.innerHTML =
      "";


    if (
      !state.bills.length
    ) {

      const empty =
        document.createElement(
          "div"
        );


      empty.className =
        "bill-empty";


      empty.textContent =
        "ยังไม่มีบิล";


      els.billList.appendChild(
        empty
      );

    }


    state.bills.forEach(
      function(bill) {

        const card =
          document.createElement(
            "article"
          );


        card.className =
          "bill-card";


        const head =
          document.createElement(
            "div"
          );


        head.className =
          "bill-head";


        const mode =
          document.createElement(
            "div"
          );


        mode.className =
          "bill-mode";


        mode.textContent =
          MODES[bill.mode].label;


        const subtotal =
          document.createElement(
            "div"
          );


        subtotal.className =
          "bill-subtotal";


        subtotal.textContent =
          numberWithCommas(
            bill.subtotal
          ) +
          " บาท";


        head.appendChild(
          mode
        );


        head.appendChild(
          subtotal
        );


        const body =
          document.createElement(
            "div"
          );


        body.className =
          "bill-body";


        const meta =
          document.createElement(
            "div"
          );


        meta.className =
          "bill-meta";


        meta.textContent =
          getBillMeta(
            bill
          );


        const numbers =
          document.createElement(
            "div"
          );


        numbers.className =
          "bill-numbers";


        numbers.textContent =
          bill.numbers.join(
            " "
          );


        body.appendChild(
          meta
        );


        body.appendChild(
          numbers
        );


        const foot =
          document.createElement(
            "div"
          );


        foot.className =
          "bill-foot";


        const del =
          document.createElement(
            "button"
          );


        del.type =
          "button";


        del.className =
          "delete-bill";


        del.textContent =
          "ลบบิล";


        del.addEventListener(
          "click",
          function() {

            deleteBill(
              bill.id
            );

          }
        );


        foot.appendChild(
          del
        );


        card.appendChild(
          head
        );


        card.appendChild(
          body
        );


        card.appendChild(
          foot
        );


        els.billList.appendChild(
          card
        );

      }
    );


    els.billCount.textContent =
      state.bills.length +
      " บิล";


    updateGrandTotal();

  }


  function getBillMeta(
    bill
  ) {

    const meta =
      MODES[bill.mode];


    const prices =
      [];


    if (
      bill.priceA > 0
    ) {

      prices.push(
        meta.priceA +
        " " +
        bill.priceA
      );

    }


    if (
      meta.priceB &&
      bill.priceB > 0
    ) {

      prices.push(
        meta.priceB +
        " " +
        bill.priceB
      );

    }


    return (
      bill.numbers.length +
      " ตัว • " +
      prices.join(
        " / "
      )
    );

  }


  function deleteBill(
    id
  ) {

    state.bills =
      state.bills.filter(
        function(bill) {

          return (
            bill.id !==
            id
          );

        }
      );


    renderBills();

  }


  /* ============================
     GRAND TOTAL
  ============================ */

  function updateGrandTotal() {

    const total =
      state.bills.reduce(
        function(sum, bill) {

          return (
            sum +
            Number(
              bill.subtotal || 0
            )
          );

        },
        0
      );


    els.grandTotal.textContent =
      numberWithCommas(
        total
      ) +
      " บาท";

  }


  /* ============================
     CLEAR
  ============================ */

  function clearPrices() {

    els.priceA.value =
      "";


    els.priceB.value =
      "";


    updateLiveTotal();

  }


  function clearBills() {

    state.bills =
      [];


    els.payloadBox.style.display =
      "none";


    els.payloadBox.textContent =
      "";


    renderBills();

  }


  /* ============================
     BUILD PAYLOAD
  ============================ */

  function buildPayloads() {

    const result =
      [];


    state.bills.forEach(
      function(bill) {

        /*
         * 2 ตัว
         */

        if (
          bill.mode === "two"
        ) {

          result.push({

            modeKey:
              "two_mix",

            label:
              "2 ตัว",

            lottoName:
              CONFIG.lottoName,

            numbers:
              bill.numbers.join(" "),

            top:
              bill.priceA,

            bottom:
              bill.priceB

          });

        }


        /*
         * 3 ตัวตรง / โต๊ด
         */

        if (
          bill.mode === "three"
        ) {

          if (
            bill.priceA > 0
          ) {

            result.push({

              modeKey:
                "three_top",

              label:
                "3 ตัวตรง",

              lottoName:
                CONFIG.lottoName,

              numbers:
                bill.numbers.join(" "),

              top:
                bill.priceA,

              bottom:
                0

            });

          }


          if (
            bill.priceB > 0
          ) {

            result.push({

              modeKey:
                "three_tod",

              label:
                "3 ตัวโต๊ด",

              lottoName:
                CONFIG.lottoName,

              numbers:
                bill.numbers.join(" "),

              top:
                0,

              bottom:
                bill.priceB

            });

          }

        }


        /*
         * 6 กลับ
         * numbers ถูกขยายไว้แล้ว
         */

        if (
          bill.mode === "six"
        ) {

          result.push({

            modeKey:
              "three_return",

            label:
              "6 กลับ",

            lottoName:
              CONFIG.lottoName,

            numbers:
              bill.numbers.join(" "),

            sourceNumbers:
              bill.sourceNumbers.join(" "),

            top:
              bill.priceA,

            bottom:
              0

          });

        }


        /*
         * 19 ประตู
         */

        if (
          bill.mode === "gate19"
        ) {

          result.push({

            modeKey:
              "two_19_gate",

            label:
              "19 ประตู",

            lottoName:
              CONFIG.lottoName,

            numbers:
              bill.numbers.join(" "),

            sourceNumbers:
              bill.sourceNumbers.join(" "),

            top:
              bill.priceA,

            bottom:
              bill.priceB

          });

        }

      }
    );


    return result;

  }


  /* ============================
     SUBMIT
  ============================ */

  function submitBills() {

    clearError();


    if (
      !state.bills.length
    ) {

      showError(
        "ยังไม่มีบิล"
      );

      return;

    }


    const payloads =
      buildPayloads();


    /*
     * ตอนนี้โชว์ Payload
     *
     * เวลานำไปต่อกับ LIFF/API เดิม
     * เปลี่ยนส่วนนี้เป็น
     *
     * apiCreateLiffOrder(...)
     * หรือ sendToLine(...)
     */

    els.payloadBox.style.display =
      "block";


    els.payloadBox.textContent =
      JSON.stringify(
        payloads,
        null,
        2
      );


    console.log(
      payloads
    );

  }


  /* ============================
     COUNTDOWN
  ============================ */

  function updateCountdown() {

    const close =
      new Date(
        CONFIG.closeAt
      );


    const now =
      new Date();


    let diff =
      close.getTime() -
      now.getTime();


    if (
      diff <= 0
    ) {

      els.countdown.textContent =
        "ปิดรับแล้ว";


      els.countdown.style.color =
        "#dc2626";


      return;

    }


    const totalSeconds =
      Math.floor(
        diff / 1000
      );


    const hours =
      Math.floor(
        totalSeconds / 3600
      );


    const minutes =
      Math.floor(
        (
          totalSeconds %
          3600
        ) /
        60
      );


    const seconds =
      totalSeconds %
      60;


    els.countdown.textContent =
      pad2(hours) +
      ":" +
      pad2(minutes) +
      ":" +
      pad2(seconds);

  }


  /* ============================
     HELPERS
  ============================ */

  function getPrice(
    value
  ) {

    return (
      Number(
        value || 0
      ) ||
      0
    );

  }


  function unique(
    list
  ) {

    return [
      ...new Set(
        list
      )
    ];

  }


  function createId() {

    return (
      Date.now() +
      "-" +
      Math.random()
      .toString(36)
      .slice(2)
    );

  }


  function numberWithCommas(
    value
  ) {

    return Number(
      value || 0
    )
    .toLocaleString(
      "en-US"
    );

  }


  function pad2(
    value
  ) {

    return String(
      value
    )
    .padStart(
      2,
      "0"
    );

  }


  function formatDateTime(
    date
  ) {

    return (
      pad2(
        date.getDate()
      ) +
      "-" +
      pad2(
        date.getMonth() + 1
      ) +
      "-" +
      date.getFullYear() +
      " " +
      pad2(
        date.getHours()
      ) +
      ":" +
      pad2(
        date.getMinutes()
      )
    );

  }


  function showError(
    message
  ) {

    els.error.textContent =
      message || "";

  }


  function clearError() {

    els.error.textContent =
      "";

  }

</script>

</body>
