        meta.textContent =
          getBillMeta(
            bill
          );


        var numbers =
          document.createElement(
            "div"
          );


        numbers.className =
          "bill-numbers";


        numbers.textContent =
          bill.numbers.join(
            " "
          );


        body.appendChild(
          meta
        );


        body.appendChild(
          numbers
        );


        var foot =
          document.createElement(
            "div"
          );


        foot.className =
          "bill-foot";


        var del =
          document.createElement(
            "button"
          );


        del.type =
          "button";


        del.className =
          "delete-bill";


        del.textContent =
          "ลบบิล";


        del.addEventListener(
          "click",
          function () {

            deleteBill(
              bill.id
            );

          }
        );


        foot.appendChild(
          del
        );


        card.appendChild(
          head
        );


        card.appendChild(
          body
        );


        card.appendChild(
          foot
        );


        els.billList.appendChild(
          card
        );

      }
    );


    els.billsCount.textContent =
      state.bills.length +
      " บิล";


    updateGrandTotal();

  }


  function getBillMeta(bill) {

    var mode =
      MODES[bill.mode];


    var parts =
      [];


    if (
      bill.priceA > 0
    ) {

      parts.push(
        mode.priceA +
        " " +
        bill.priceA
      );

    }


    if (
      mode.priceB &&
      bill.priceB > 0
    ) {

      parts.push(
        mode.priceB +
        " " +
        bill.priceB
      );

    }


    if (
      bill.mode === "six"
    ) {

      return (
        bill.sourceNumbers.length +
        " ชุด • " +
        bill.numbers.length +
        " ตัว • " +
        parts.join(" / ")
      );

    }


    if (
      bill.mode === "gate19"
    ) {

      return (
        "เลขตั้งต้น " +
        bill.sourceNumbers.join(", ") +
        " • " +
        bill.numbers.length +
        " ตัว • " +
        parts.join(" / ")
      );

    }


    return (
      bill.numbers.length +
      " ตัว • " +
      parts.join(" / ")
    );

  }


  function deleteBill(id) {

    state.bills =
      state.bills.filter(
        function (bill) {

          return bill.id !==
            id;

        }
      );


    renderBills();

  }


  function clearAllBills() {

    state.bills =
      [];


    clearCurrent();

    clearPrices();

    renderBills();

  }


  function updateGrandTotal() {

    var total =
      state.bills.reduce(
        function (sum,bill) {

          return (
            sum +
            Number(
              bill.subtotal || 0
            )
          );

        },
        0
      );


    els.grandTotal.textContent =
      numberWithCommas(
        total
      ) +
      " บาท";

  }


  /* ==========================================================
     PAYLOAD
  ========================================================== */

  function buildPayloads() {

    var lottoName =
      els.lotto.value;


    if (!lottoName) {

      throw new Error(
        "กรุณาเลือกหวย"
      );

    }


    if (
      !state.bills.length
    ) {

      throw new Error(
        "ยังไม่มีบิล"
      );

    }


    var selectedOption =
      els.lotto.selectedOptions[0];


    var closeTime =
      selectedOption
        ? (
            selectedOption.dataset.closeTime ||
            ""
          )
        : "";


    var payloads =
      [];


    state.bills.forEach(
      function (bill) {


        /*
         * =====================================
         * 2 ตัว
         * =====================================
         *
         * ถ้าใส่ทั้งบนและล่าง
         * แยกเป็น 2 payload
         * เพื่อใช้ mode เดิมของระบบแรก
         */

        if (
          bill.mode === "two"
        ) {


          if (
            bill.priceA > 0
          ) {

            payloads.push({

              modeKey:
                "two_top",

              label:
                "2 ตัวบน",

              lottoName:
                lottoName,

              closeTime:
                closeTime,

              kind:
                "two",

              numbers:
                bill.numbers.join(" "),

              displayNumbers:
                bill.numbers.slice(),

              top:
                bill.priceA,

              bottom:
                0

            });

          }


          if (
            bill.priceB > 0
          ) {

            payloads.push({

              modeKey:
                "two_bottom",

              label:
                "2 ตัวล่าง",

              lottoName:
                lottoName,

              closeTime:
                closeTime,

              kind:
                "two",

              numbers:
                bill.numbers.join(" "),

              displayNumbers:
                bill.numbers.slice(),

              top:
                0,

              bottom:
                bill.priceB

            });

          }

        }


        /*
         * =====================================
         * 3 ตัว
         * =====================================
         */

        if (
          bill.mode === "three"
        ) {


          if (
            bill.priceA > 0
          ) {

            payloads.push({

              modeKey:
                "three_top",

              label:
                "3 ตัวตรง",

              lottoName:
                lottoName,

              closeTime:
                closeTime,

              kind:
                "three",

              numbers:
                bill.numbers.join(" "),

              displayNumbers:
                bill.numbers.slice(),

              top:
                bill.priceA,

              bottom:
                0

            });

          }


          if (
            bill.priceB > 0
          ) {

            payloads.push({

              modeKey:
                "three_tod",

              label:
                "3 ตัวโต๊ด",

              lottoName:
                lottoName,

              closeTime:
                closeTime,

              kind:
                "three",

              numbers:
                bill.numbers.join(" "),

              displayNumbers:
                bill.numbers.slice(),

              top:
                0,

              bottom:
                bill.priceB

            });

          }

        }


        /*
         * =====================================
         * 6 กลับ
         * =====================================
         *
         * สำคัญ:
         *
         * หน้าเว็บโชว์เลขที่กลับแล้วทั้งหมด
         *
         * แต่ API ส่งเฉพาะเลขต้นฉบับ
         * เพราะ mode three_return
         * จะให้ backend กลับอีกครั้งเอง
         *
         * ป้องกัน "กลับซ้ำ"
         */

        if (
          bill.mode === "six"
        ) {

          payloads.push({

            modeKey:
              "three_return",

            label:
              "6 กลับ",

            lottoName:
              lottoName,

            closeTime:
              closeTime,

            kind:
              "three",

            numbers:
              bill.sourceNumbers.join(" "),

            displayNumbers:
              bill.numbers.slice(),

            sourceNumbers:
              bill.sourceNumbers.slice(),

            top:
              bill.priceA,

            bottom:
              0

          });

        }


        /*
         * =====================================
         * 19 ประตู
         * =====================================
         *
         * หน้าเว็บขยายเลขแล้ว
         * จึงส่งเป็น 2 ตัวบน/ล่าง
         * เหมือนระบบเดิม
         */

        if (
          bill.mode === "gate19"
        ) {


          if (
            bill.priceA > 0
          ) {

            payloads.push({

              modeKey:
                "two_top",

              label:
                "19 ประตู บน",

              lottoName:
                lottoName,

              closeTime:
                closeTime,

              kind:
                "two",

              numbers:
                bill.numbers.join(" "),

              displayNumbers:
                bill.numbers.slice(),

              top:
                bill.priceA,

              bottom:
                0

            });

          }


          if (
            bill.priceB > 0
          ) {

            payloads.push({

              modeKey:
                "two_bottom",

              label:
                "19 ประตู ล่าง",

              lottoName:
                lottoName,

              closeTime:
                closeTime,

              kind:
                "two",

              numbers:
                bill.numbers.join(" "),

              displayNumbers:
                bill.numbers.slice(),

              top:
                0,

              bottom:
                bill.priceB

            });

          }

        }

      }
    );


    return payloads;

  }


  /*
   * ก่อนส่ง API
   * เอา field ที่ใช้เฉพาะ UI ออก
   */

  function getApiPayload(item) {

    return {

      modeKey:
        item.modeKey,

      label:
        item.label,

      lottoName:
        item.lottoName,

      closeTime:
        item.closeTime,

      kind:
        item.kind,

      numbers:
        item.numbers,

      top:
        item.top,

      bottom:
        item.bottom

    };

  }


  /* ==========================================================
     CONFIRM
  ========================================================== */

  function openConfirm() {

    clearError();


    var payloads;


    try {

      payloads =
        buildPayloads();

    } catch (err) {

      showError(
        err
      );

      return;

    }


    state.pendingPayloads =
      payloads;


    renderConfirm();

    els.confirmOverlay.classList.add(
      "show"
    );

  }


  function closeConfirm() {

    els.confirmOverlay.classList.remove(
      "show"
    );

  }


  function renderConfirm() {

    els.confirmBody.innerHTML =
      "";


    var total =
      state.bills.reduce(
        function (sum,bill) {

          return (
            sum +
            bill.subtotal
          );

        },
        0
      );


    var totalNumbers =
      state.bills.reduce(
        function (sum,bill) {

          return (
            sum +
            bill.numbers.length
          );

        },
        0
      );


    els.confirmSubtitle.textContent =
      els.lotto.value;


    var summary =
      document.createElement(
        "div"
      );


    summary.className =
      "confirm-summary";


    summary.appendChild(
      createSummaryBox(
        "หวย",
        els.lotto.value
      )
    );


    summary.appendChild(
      createSummaryBox(
        "จำนวน",
        totalNumbers +
        " ตัว"
      )
    );


    summary.appendChild(
      createSummaryBox(
        "รวม",
        numberWithCommas(total) +
        " บาท"
      )
    );


    els.confirmBody.appendChild(
      summary
    );


    state.bills.forEach(
      function (bill) {

        var group =
          document.createElement(
            "section"
          );


        group.className =
          "confirm-group";


        var head =
          document.createElement(
            "div"
          );


        head.className =
          "confirm-group-head";


        var title =
          document.createElement(
            "div"
          );


        title.textContent =
          MODES[bill.mode].label;


        var meta =
          document.createElement(
            "div"
          );


        meta.className =
          "confirm-group-meta";


        meta.textContent =
          getBillMeta(
            bill
          );


        head.appendChild(
          title
        );


        head.appendChild(
          meta
        );


        var numbers =
          document.createElement(
            "div"
          );


        numbers.className =
          "confirm-numbers";


        numbers.textContent =
          bill.numbers.join(
            " "
          );


        group.appendChild(
          head
        );


        group.appendChild(
          numbers
        );


        els.confirmBody.appendChild(
          group
        );

      }
    );

  }


  function createSummaryBox(
    label,
    value
  ) {

    var box =
      document.createElement(
        "div"
      );


    box.className =
      "summary-box";


    var labelElement =
      document.createElement(
        "div"
      );


    labelElement.className =
      "summary-label";


    labelElement.textContent =
      label;


    var valueElement =
      document.createElement(
        "div"
      );


    valueElement.className =
      "summary-value";


    valueElement.textContent =
      value;


    box.appendChild(
      labelElement
    );


    box.appendChild(
      valueElement
    );


    return box;

  }


  /* ==========================================================
     CONFIRM + API + LINE
  ========================================================== */

  function confirmAndSend() {

    if (
      !state.pendingPayloads ||
      !state.pendingPayloads.length
    ) {

      return;

    }


    if (
      !canSendToChat()
    ) {

      closeConfirm();


      showLiffGate(
        "ต้องเปิดผ่าน LINE ก่อนส่งโพย"
      );


      showError(
        "กด เปิดใน LINE แล้วลองอีกครั้ง"
      );


      return;

    }


    var payloads =
      state.pendingPayloads.slice();


    closeConfirm();

    setLoading(
      true
    );


    Promise.all(

      payloads.map(
        function (item) {

          return apiCreateLiffOrder(
            getApiPayload(
              item
            )
          );

        }
      )

    )
    .then(
      function (results) {

        var fallbackMessages =
          [];


        results.forEach(
          function (result) {

            fallbackMessages =
              fallbackMessages.concat(
                extractLineMessages(
                  result
                )
              );

          }
        );


        var messages =
          buildCombinedOrderMessages(
            payloads,
            fallbackMessages
          );


        return sendToLine(
          messages
        );

      }
    )
    .catch(
      function (err) {

        setLoading(
          false
        );


        showError(
          err
        );

      }
    );

  }


  /* ==========================================================
     LINE FLEX
  ========================================================== */

  function buildCombinedOrderMessages(
    payloads,
    fallbackMessages
  ) {

    var local =
      buildCombinedOrderFlex(
        payloads
      );


    if (local) {

      return [
        local
      ];

    }


    return fallbackMessages;

  }


  function buildCombinedOrderFlex(
    payloads
  ) {

    if (
      !payloads ||
      !payloads.length
    ) {

      return null;

    }


    var lottoName =
      payloads[0].lottoName ||
      "โพยหวย";


    var closeTime =
      payloads[0].closeTime ||
      "";


    var groups =
      [];


    var totalAmount =
      0;


    var uniqueNumbers =
      {};


    payloads.forEach(
      function (item) {

        var numbers =
          item.displayNumbers &&
          item.displayNumbers.length
            ? item.displayNumbers.slice()
            : String(
                item.numbers || ""
              )
              .split(/\s+/)
              .filter(Boolean);


        var price =
          (
            Number(
              item.top || 0
            ) ||
            0
          ) +
          (
            Number(
              item.bottom || 0
            ) ||
            0
          );


        var subtotal =
          numbers.length *
          price;


        totalAmount +=
          subtotal;


        numbers.forEach(
          function (number) {

            uniqueNumbers[number] =
              true;

          }
        );


        groups.push({

          label:
            item.label,

          numbers:
            numbers,

          top:
            Number(
              item.top || 0
            ) ||
            0,

          bottom:
            Number(
              item.bottom || 0
            ) ||
            0,

          subtotal:
            subtotal

        });

      }
    );


    var groupBlocks =
      [];


    groups.forEach(
      function (group,index) {

        groupBlocks.push({

          type: "box",

          layout: "horizontal",

          margin:
            index === 0
              ? "none"
              : "lg",

          contents: [

            {
              type: "text",
              text: group.label,
              color: "#B91C1C",
              size: "sm",
              weight: "bold",
              flex: 0
            },

            {
              type: "text",
              text:
                getFlexPriceText(
                  group
                ),
              color: "#9CA3AF",
              size: "xs",
              align: "end"
            }

          ]

        });


        groupBlocks.push({

          type: "box",

          layout: "horizontal",

          margin: "xs",

          contents: [

            {
              type: "text",
              text:
                group.numbers.length +
                " ตัว",
              color: "#9CA3AF",
              size: "xs",
              flex: 0
            },

            {
              type: "text",
              text:
                "= " +
                numberWithCommas(
                  group.subtotal
                ) +
                " บาท",
              color: "#6B7280",
              size: "xs",
              weight: "bold",
              align: "end"
            }

          ]

        });


        groupBlocks.push({

          type: "box",

          layout: "vertical",

          margin: "sm",

          paddingAll: "10px",

          backgroundColor:
            "#FEF2F2",

          cornerRadius:
            "8px",

          contents: [

            {
              type: "text",
              text:
                group.numbers.join(
                  " "
                ),
              color: "#7F1D1D",
              weight: "bold",
              size: "sm",
              wrap: true
            }

          ]

        });

      }
    );


    var bank =
      state.bank ||
      {};


    var bankNumber =
      bank.number ||
      "5054158114";


    var bankName =
      bank.name ||
      "น.ส. ทิพวรรณ ฮุ่งเมือง";


    var bankTitle =
      bank.bank ||
      "ไทยพาณิชย์ (SCB)";


    return {

      type: "flex",

      altText:
        lottoName +
        " รวม " +
        totalAmount +
        " บาท",

      contents: {

        type: "bubble",

        size: "kilo",


        header: {

          type: "box",

          layout: "vertical",

          paddingAll: "18px",

          backgroundColor:
            "#B91C1C",

          contents: [

            {
              type: "text",
              text: lottoName,
              color: "#FFFFFF",
              weight: "bold",
              size: "xl",
              wrap: true
            },

            {
              type: "box",
              layout: "horizontal",
              margin: "sm",
              contents: [

                {
                  type: "text",
                  text:
                    "ปิด " +
                    (
                      closeTime ||
                      "--:--"
                    ),
                  color: "#FEE2E2",
                  size: "xs",
                  flex: 0
                },

                {
                  type: "text",
                  text:
                    "• " +
                    Object.keys(
                      uniqueNumbers
                    ).length +
                    " ตัว",
                  color: "#FEE2E2",
                  size: "xs",
                  margin: "sm",
                  flex: 0
                }

              ]
            }

          ]

        },


        body: {

          type: "box",

          layout: "vertical",

          paddingAll: "18px",

          backgroundColor:
            "#FFFFFF",

          contents:
            groupBlocks.concat([

              {
                type: "separator",
                margin: "lg",
                color: "#FCA5A5"
              },


              {
                type: "box",

                layout: "vertical",

                margin: "lg",

                paddingAll: "14px",

                backgroundColor:
                  "#FEF2F2",

                cornerRadius:
                  "10px",

                contents: [

                  {
                    type: "text",
                    text: "ยอดโอน",
                    color: "#DC2626",
                    size: "xs",
                    align: "center",
                    weight: "bold"
                  },

                  {
                    type: "box",
                    layout: "baseline",
                    margin: "xs",
                    justifyContent: "center",
                    contents: [

                      {
                        type: "text",
                        text:
                          numberWithCommas(
                            totalAmount
                          ),
                        color: "#B91C1C",
                        size: "3xl",
                        weight: "bold",
                        flex: 0
                      },

                      {
                        type: "text",
                        text: " บาท",
                        color: "#DC2626",
                        size: "md",
                        weight: "bold",
                        flex: 0
                      }

                    ]
                  }

                ]

              },


              {
                type: "box",

                layout: "vertical",

                margin: "md",

                paddingAll: "13px",

                backgroundColor:
                  "#FFF7F7",

                cornerRadius:
                  "10px",

                borderColor:
                  "#FCA5A5",

                borderWidth:
                  "1px",

                contents: [

                  {
                    type: "text",
                    text: "บัญชีโอน",
                    color: "#DC2626",
                    size: "xs",
                    weight: "bold"
                  },

                  {
                    type: "text",
                    text:
                      bankNumber,
                    color: "#7F1D1D",
                    size: "xl",
                    weight: "bold",
                    margin: "xs",
                    wrap: true
                  },

                  {
                    type: "text",
                    text:
                      bankTitle,
                    color: "#991B1B",
                    size: "sm",
                    margin: "xs",
                    wrap: true
                  },

                  {
                    type: "text",
                    text:
                      bankName,
                    color: "#991B1B",
                    size: "sm",
                    margin: "xs",
                    wrap: true
                  },

                  {
                    type: "button",
                    style: "secondary",
                    height: "sm",
                    margin: "md",
                    action: {
                      type: "clipboard",
                      label:
                        "คัดลอกเลขบัญชี",
                      clipboardText:
                        bankNumber
                    }
                  }

                ]

              }

            ])

        }

      }

    };

  }


  function getFlexPriceText(group) {

    if (
      group.top &&
      group.bottom
    ) {

      return (
        "บน " +
        group.top +
        " ล่าง " +
        group.bottom
      );

    }


    if (group.top) {

      return (
        group.top +
        " บาท"
      );

    }


    if (group.bottom) {

      return (
        group.bottom +
        " บาท"
      );

    }


    return "0 บาท";

  }


  /* ==========================================================
     SEND LINE
  ========================================================== */

  function sendToLine(messages) {

    var safeMessages =
      mergeFlexMessages(

        messages
          .map(
            normalizeLineMessage
          )
          .filter(Boolean)

      );


    if (
      !safeMessages.length
    ) {

      setLoading(
        false
      );


      throw new Error(
        "สร้าง Flex ไม่สำเร็จ"
      );

    }


    return ensureChatWritePermission()
      .then(
        function () {

          return liff.sendMessages(
            safeMessages
          );

        }
      )
      .then(
        function () {

          state.pendingPayloads =
            null;


          setLoading(
            false
          );


          if (
            liff.isInClient()
          ) {

            liff.closeWindow();

          }

        }
      );

  }


  function extractLineMessages(res) {

    if (!res) {
      return [];
    }


    if (
      Array.isArray(res)
    ) {

      return res;

    }


    if (
      Array.isArray(
        res.messages
      )
    ) {

      return res.messages;

    }


    if (
      Array.isArray(
        res.flex
      )
    ) {

      return res.flex;

    }


    return [
      res.flex ||
      res.message ||
      res
    ];

  }


  function normalizeLineMessage(message) {

    if (!message) {
      return null;
    }


    if (
      typeof message ===
      "string"
    ) {

      try {

        message =
          JSON.parse(
            message
          );

      } catch (err) {

        return null;

      }

    }


    if (
      message.type === "flex"
    ) {

      if (
        !message.altText
      ) {

        message.altText =
          "โพยหวย";

      }


      return message;

    }


    if (
      message.contents
    ) {

      return {

        type: "flex",

        altText:
          message.altText ||
          "โพยหวย",

        contents:
          message.contents

      };

    }


    if (
      message.type === "bubble" ||
      message.type === "carousel" ||
      message.body ||
      message.hero
    ) {

      return {

        type: "flex",

        altText:
          "โพยหวย",

        contents:
          message

      };

    }


    return null;

  }


  function mergeFlexMessages(messages) {

    var bubbles =
      [];


    messages.forEach(
      function (message) {

        if (
          !message ||
          message.type !== "flex" ||
          !message.contents
        ) {

          return;

        }


        if (
          message.contents.type ===
            "carousel" &&
          Array.isArray(
            message.contents.contents
          )
        ) {

          bubbles =
            bubbles.concat(
              message.contents.contents
            );

        } else {

          bubbles.push(
            message.contents
          );

        }

      }
    );


    if (
      !bubbles.length
    ) {

      return [];

    }


    if (
      bubbles.length === 1
    ) {

      return [{

        type: "flex",

        altText:
          "โพยหวย",

        contents:
          bubbles[0]

      }];

    }


    return [{

      type: "flex",

      altText:
        "โพยหวย",

      contents: {

        type: "carousel",

        contents:
          bubbles.slice(
            0,
            12
          )

      }

    }];

  }


  function ensureChatWritePermission() {

    if (
      !window.liff ||
      !liff.permission ||
      typeof liff.permission.query !==
        "function"
    ) {

      return Promise.resolve();

    }


    return liff.permission
      .query(
        "chat_message.write"
      )
      .then(
        function (permission) {

          if (
            !permission ||
            permission.state ===
              "granted"
          ) {

            return;

          }


          if (
            typeof liff.permission.requestAll ===
              "function"
          ) {

            return liff.permission
              .requestAll();

          }


          throw new Error(
            "LIFF ยังไม่ได้เปิดสิทธิ์ chat_message.write"
          );

        }
      );

  }


  /* ==========================================================
     UTIL
  ========================================================== */

  function setLoading(on) {

    els.loading.classList.toggle(
      "show",
      !!on
    );

  }


  function showToast(message) {

    els.toast.textContent =
      message;


    els.toast.classList.add(
      "show"
    );


    clearTimeout(
      toastTimer
    );


    toastTimer =
      setTimeout(
        function () {

          els.toast.classList.remove(
            "show"
          );

        },
        1200
      );

  }


  function showError(err) {

    setLoading(
      false
    );


    els.error.textContent =
      formatError(
        err
      );

  }


  function clearError() {

    els.error.textContent =
      "";

  }


  function formatError(err) {

    if (!err) {

      return "เกิดข้อผิดพลาด";

    }


    if (
      typeof err ===
      "string"
    ) {

      return err;

    }


    if (
      err.message
    ) {

      return err.message;

    }


    try {

      return JSON.stringify(
        err
      );

    } catch (jsonErr) {

      return String(
        err
      );

    }

  }


  function unique(list) {

    var seen =
      {};


    return list.filter(
      function (item) {

        if (
          seen[item]
        ) {

          return false;

        }


        seen[item] =
          true;


        return true;

      }
    );

  }


  function createId() {

    return (
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2)
    );

  }


  function numberWithCommas(value) {

    return Number(
      value || 0
    )
    .toLocaleString(
      "en-US"
    );

  }


  function pad2(value) {

    return String(
      value
    )
    .padStart(
      2,
      "0"
    );

  }

</script>
